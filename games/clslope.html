<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Slope — Clash Proxy</title>
<style>
	html, body { margin: 0; height: 100%; background: #05050c; overflow: hidden; font-family: Arial, Helvetica, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
	canvas { display: block; width: 100%; height: 100%; }
	#hud { position: fixed; top: 10px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 16px; color: #fff; font-weight: bold; pointer-events: none; text-shadow: 0 0 6px #000; }
	#score { font-size: 30px; color: #00ff88; text-shadow: 0 0 12px rgba(0,255,136,.6); }
	#best { font-size: 14px; opacity: .85; margin-top: 6px; }
	#speed { font-size: 14px; color: #7fd7ff; margin-top: 8px; }
	#overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; background: rgba(5,5,12,.72); text-align: center; pointer-events: none; }
	#overlay.hidden { display: none; }
	#overlay h1 { font-size: 56px; margin: 0 0 8px; color: #00ff88; text-shadow: 0 0 22px rgba(0,255,136,.65); letter-spacing: 6px; }
	#overlay p { margin: 5px 0; opacity: .85; }
	#overlay .cta { font-size: 20px; margin-top: 18px; color: #ffd166; animation: pulse 1.1s ease-in-out infinite alternate; }
	#overlay .final { font-size: 26px; color: #fff; margin-top: 10px; display: none; }
	#overlay .final b { color: #00ff88; }
	@keyframes pulse { from { opacity: .55; } to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
	<div><div id="score">0</div><div id="speed"></div></div>
	<div id="best"></div>
</div>
<div id="overlay">
	<h1>SLOPE</h1>
	<p>← → or A / D to steer &nbsp;·&nbsp; avoid the red walls</p>
	<p>On touch: hold the left / right side of the screen</p>
	<p class="cta" id="cta">Press any key to start</p>
	<div class="final" id="final"></div>
</div>
<script>
(function () {
	var cv = document.getElementById("c");
	var ctx = cv.getContext("2d");
	var overlay = document.getElementById("overlay");
	var ctaEl = document.getElementById("cta");
	var finalEl = document.getElementById("final");
	var scoreEl = document.getElementById("score");
	var bestEl = document.getElementById("best");
	var speedEl = document.getElementById("speed");

	var W = 0, H = 0, horizon = 0;
	var FOCAL = 160, CAM_H = 5, CAM_DIST = 6;
	var ROAD_HALF = 6, BALL_R = 1.0;
	var WALL_H = 2.2;
	var VIEW = 130;
	var START_SPEED = 26, MAX_SPEED = 62, ACCEL = 1.8;
	var STEER_ACCEL = 110, STEER_FRICTION = 0.14;
	var CURVE_MAX = 0.3, CENTER_LIMIT = 45;

	var state = "start"; // start | play | dead
	var playerZ = 0, prevZ = 0, speed = 0, ballX = 0, ballVX = 0;
	var centers = [], walls = {};
	var curveVel = 0, nextWallZ = 60;
	var score = 0, best = 0, deadT = 0, runId = 0;
	var bestKey = "clash_slope_best";
	try { best = parseInt(localStorage.getItem(bestKey) || "0", 10) || 0; } catch (e) {}

	var keys = { left: false, right: false };
	var touchDir = 0, touchPointer = null;
	var stars = [];

	function resize() {
		var dpr = Math.min(window.devicePixelRatio || 1, 2);
		W = window.innerWidth;
		H = window.innerHeight;
		cv.width = Math.round(W * dpr);
		cv.height = Math.round(H * dpr);
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		horizon = H * 0.42;
		stars = [];
		for (var i = 0; i < 70; i++) {
			stars.push({ x: Math.random(), y: Math.random() * 0.4, r: Math.random() * 1.4 + 0.3, a: Math.random() * 0.6 + 0.15 });
		}
	}
	window.addEventListener("resize", resize);
	resize();

	function ensureTrack(upto) {
		while (centers.length <= upto) {
			var z = centers.length;
			if (Math.random() < 0.045) curveVel = (Math.random() - 0.5) * 2 * CURVE_MAX;
			curveVel *= 0.997;
			if (Math.random() < 0.008) curveVel = 0;
			var next = (centers[z - 1] || 0) + curveVel;
			if (next > CENTER_LIMIT) { next = CENTER_LIMIT; curveVel = 0; }
			if (next < -CENTER_LIMIT) { next = -CENTER_LIMIT; curveVel = 0; }
			centers.push(next);
			if (z >= nextWallZ && z > 60 && z < 100000) {
				walls[z] = { off: [-2.4, 0, 2.4][(Math.random() * 3) | 0], half: 2.6 };
				nextWallZ = z + 10 + ((Math.random() * 13) | 0);
			}
		}
	}

	function begin() {
		centers = [0];
		walls = {};
		curveVel = 0;
		nextWallZ = 60;
		playerZ = 0;
		prevZ = 0;
		ballX = 0;
		ballVX = 0;
		speed = START_SPEED;
		score = 0;
		deadT = 0;
		runId++;
		ensureTrack(200);
		state = "play";
		finalEl.style.display = "none";
		ctaEl.style.display = "none";
		overlay.classList.add("hidden");
		scoreEl.textContent = "0";
	}

	function die(reason) {
		if (state !== "play") return;
		state = "dead";
		deadT = 0;
		if (score > best) {
			best = score;
			try { localStorage.setItem(bestKey, String(best)); } catch (e) {}
		}
		bestEl.textContent = "BEST " + best;
		setTimeout(function () {
			if (state !== "dead") return;
			finalEl.style.display = "block";
			finalEl.innerHTML = score + "m — " + reason + "<br><b>Best: " + best + "m</b>";
			ctaEl.style.display = "block";
			ctaEl.textContent = "Press any key / tap to try again";
			overlay.classList.remove("hidden");
		}, 550);
	}

	function project(z, x, h) {
		var rel = z - camZ;
		if (rel < 0.45) return null;
		var s = FOCAL / rel;
		return { x: W / 2 + (x - camX) * s, y: horizon + (CAM_H - (h || 0)) * s, s: s };
	}

	var camZ = -CAM_DIST, camX = 0;

	function step(dt) {
		prevZ = playerZ;
		speed = Math.min(MAX_SPEED, speed + ACCEL * dt);
		playerZ += speed * dt;
		ensureTrack(Math.ceil(playerZ) + VIEW + 5);

		var input = (keys.left ? -1 : 0) + (keys.right ? 1 : 0) + touchDir;
		if (input > 1) input = 1;
		if (input < -1) input = -1;
		ballVX += input * STEER_ACCEL * dt;
		ballVX *= Math.pow(STEER_FRICTION, dt);
		ballX += ballVX * dt;

		var zi = playerZ < 0 ? 0 : Math.floor(playerZ);
		var c = centers[zi] || 0;
		if (Math.abs(ballX - c) > ROAD_HALF - BALL_R * 0.4) { die("fell off the edge"); return; }

		var zFrom = Math.max(0, Math.floor(prevZ));
		var zTo = Math.floor(playerZ);
		for (var z = zFrom; z <= zTo; z++) {
			var w = walls[z];
			if (w && playerZ > z && prevZ < z + 1) {
				var cz = centers[z] || 0;
				if (Math.abs(ballX - (cz + w.off)) < w.half + BALL_R) { die("hit a wall"); return; }
			}
		}

		score = Math.floor(playerZ);
		scoreEl.textContent = String(score);
		speedEl.textContent = Math.round(speed * 6) + " km/h";
	}

	function quad(p1, p2, p3, p4, fill) {
		ctx.beginPath();
		ctx.moveTo(p1.x, p1.y);
		ctx.lineTo(p2.x, p2.y);
		ctx.lineTo(p3.x, p3.y);
		ctx.lineTo(p4.x, p4.y);
		ctx.closePath();
		ctx.fillStyle = fill;
		ctx.fill();
	}

	function draw() {
		ctx.fillStyle = "#05050c";
		ctx.fillRect(0, 0, W, H);

		// stars
		for (var i = 0; i < stars.length; i++) {
			var st = stars[i];
			ctx.globalAlpha = st.a;
			ctx.fillStyle = "#cfe8ff";
			ctx.fillRect(st.x * W, st.y * H, st.r, st.r);
		}
		ctx.globalAlpha = 1;

		// horizon glow
		var g = ctx.createLinearGradient(0, horizon - 50, 0, horizon + 30);
		g.addColorStop(0, "rgba(0,180,255,0)");
		g.addColorStop(1, "rgba(0,180,255,0.14)");
		ctx.fillStyle = g;
		ctx.fillRect(0, horizon - 50, W, 80);

		camZ = playerZ - CAM_DIST;
		camX = ballX * 0.65;

		var iFar = Math.min(centers.length - 2, Math.ceil(playerZ + VIEW));
		var iNear = Math.max(0, Math.floor(camZ + 1));

		for (var i = iFar; i >= iNear; i--) {
			var c0 = centers[i];
			if (c0 === undefined) continue;
			var c1 = centers[i + 1];
			if (c1 === undefined) c1 = c0;
			var a = project(i, c0 - ROAD_HALF, 0);
			var b = project(i, c0 + ROAD_HALF, 0);
			var cc = project(i + 1, c1 - ROAD_HALF, 0);
			var d = project(i + 1, c1 + ROAD_HALF, 0);
			if (!a || !b) continue;
			if (!cc || !d) { cc = a; d = b; }

			quad(a, b, d, cc, (i & 1) ? "#0e0e1a" : "#131324");

			// neon edges
			ctx.lineWidth = Math.max(1, a.s * 0.05);
			ctx.strokeStyle = (i & 1) ? "#00ff88" : "#00d977";
			ctx.beginPath();
			ctx.moveTo(a.x, a.y); ctx.lineTo(cc.x, cc.y);
			ctx.moveTo(b.x, b.y); ctx.lineTo(d.x, d.y);
			ctx.stroke();

			var w = walls[i];
			if (w) {
				var wa = project(i, c0 + w.off - w.half, 0);
				var wb = project(i, c0 + w.off + w.half, 0);
				var waT = project(i, c0 + w.off - w.half, WALL_H);
				var wbT = project(i, c0 + w.off + w.half, WALL_H);
				var wa2 = project(i + 1, c0 + w.off - w.half, 0);
				var wb2 = project(i + 1, c0 + w.off + w.half, 0);
				var wa2T = project(i + 1, c0 + w.off - w.half, WALL_H);
				var wb2T = project(i + 1, c0 + w.off + w.half, WALL_H);
				if (wa && wb && waT && wbT) {
					// top face
					if (wa2T && wb2T && waT && wbT) quad(waT, wbT, wb2T, wa2T, "#8f1230");
					// front face
					quad(wa, wb, wbT, waT, "#ff2d55");
					ctx.lineWidth = Math.max(1, wa.s * 0.04);
					ctx.strokeStyle = "#ff7a97";
					ctx.stroke();
				}
			}
		}

		// ball
		var p = project(playerZ, ballX, 0);
		if (p) {
			var fall = 0, shrink = 1;
			if (state === "dead") {
				fall = deadT * deadT * 420;
				shrink = Math.max(0.15, 1 - deadT * 1.4);
			}
			var r = BALL_R * p.s * shrink;
			var bx = p.x, by = p.y + fall;
			// shadow
			ctx.beginPath();
			ctx.ellipse(p.x, p.y + r * 0.55, r * 0.95, r * 0.3, 0, 0, Math.PI * 2);
			ctx.fillStyle = "rgba(0,0,0,0.5)";
			ctx.fill();
			// ball
			var bg = ctx.createRadialGradient(bx - r * 0.35, by - r * 0.4, r * 0.1, bx, by, r);
			bg.addColorStop(0, "#ff8fa3");
			bg.addColorStop(0.45, "#ff3b52");
			bg.addColorStop(1, "#b3122e");
			ctx.beginPath();
			ctx.arc(bx, by, r, 0, Math.PI * 2);
			ctx.fillStyle = bg;
			ctx.fill();
			ctx.lineWidth = Math.max(1, r * 0.09);
			ctx.strokeStyle = "rgba(255,255,255,0.35)";
			ctx.stroke();
		}
	}

	var lastT = 0;
	function frame(t) {
		var dt = lastT ? (t - lastT) / 1000 : 0.016;
		lastT = t;
		if (dt > 0.05) dt = 0.05;
		if (state === "play") step(dt);
		else if (state === "dead") deadT += dt;
		draw();
		if (best > 0) bestEl.textContent = "BEST " + best;
		requestAnimationFrame(frame);
	}
	requestAnimationFrame(frame);

	function startOrRestart() {
		if (state === "start") begin();
		else if (state === "dead" && deadT > 0.8) begin();
	}

	document.addEventListener("keydown", function (e) {
		var k = e.key.toLowerCase();
		if (k === "arrowleft" || k === "a") { keys.left = true; e.preventDefault(); }
		if (k === "arrowright" || k === "d") { keys.right = true; e.preventDefault(); }
		if (k === " " || k === "enter" || k.startsWith("arrow")) startOrRestart();
		if (state === "start" && !e.repeat) startOrRestart();
	});
	document.addEventListener("keyup", function (e) {
		var k = e.key.toLowerCase();
		if (k === "arrowleft" || k === "a") keys.left = false;
		if (k === "arrowright" || k === "d") keys.right = false;
	});

	function updateTouch(e) {
		touchDir = (e.clientX < W / 2) ? -1 : 1;
	}
	window.addEventListener("pointerdown", function (e) {
		touchPointer = e.pointerId;
		updateTouch(e);
		startOrRestart();
	});
	window.addEventListener("pointermove", function (e) {
		if (touchPointer === e.pointerId) updateTouch(e);
	});
	function endTouch(e) {
		if (touchPointer === e.pointerId) { touchPointer = null; touchDir = 0; }
	}
	window.addEventListener("pointerup", endTouch);
	window.addEventListener("pointercancel", endTouch);

	window.addEventListener("blur", function () {
		keys.left = keys.right = false;
		touchDir = 0;
		touchPointer = null;
	});
})();
</script>
</body>
</html>
