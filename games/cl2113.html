<!-- yandexGamesWrapper stub (Chameleon SDK v3 bridge) -->
<script>
/* Chameleon SDK v3 — framework.js bridge sözleşmesi:
   Tüm resolve* fonksiyonlar SENKRON string döndürmeli.
   Cache SDK init sırasında doldurulur, Unity onları senkron okur.  */

window.yandexGamesWrapper = (function(){

  /* ── İç state ── */
  var _cache     = {};   /* { containerTag: jsonString } */
  var _dirty     = {};   /* { containerTag: true }       */
  var _products  = '[]';
  var _purchases = '[]';
  var _language  = 'en';
  var _ysdk      = null;
  var _player    = null;
  var _gi        = null;
  var _interOpen = false;
  var _rewOpen   = false;

  /* ── Helpers ── */
  function safeStr(v) {
    if(v === null || v === undefined) return '{}';
    if(typeof v === 'string') return v;
    return JSON.stringify(v);
  }

  var wrapper = {

    /* ─── Chameleon lifecycle ─────────────────────────── */
    initialize:      function(){ console.log('[wrapper] initialize'); },
    gameIsReady:     function(){ console.log('[wrapper] gameIsReady'); },
    setGameInstance: function(inst){ _gi = inst; },
    setSDK:          function(sdk){ _ysdk = sdk; _language = (sdk&&sdk.environment.i18n.lang)||'en'; },
    setPlayer:       function(p){ _player = p; },

    /* ─── Prefill cache (SDK init sırasında çağrılır) ── */
    prefillCache: function(tags, playerObj) {
      _player = playerObj;
      if(!_player) return Promise.resolve();
      return _player.getData(tags).then(function(data){
        tags.forEach(function(tag){
          _cache[tag] = data && data[tag] ? safeStr(data[tag]) : '{}';
        });
        console.log('[wrapper] cache prefilled:', Object.keys(_cache));
      }).catch(function(e){ console.warn('[wrapper] prefill error:', e); });
    },

    /* ─── Senkron OKUMA — Unity bunları senkron çağırır ─ */
    resolveCacheSaves:  function(tag){ return _cache[tag] || '{}'; },
    resolveLanguage:    function(){    return _language;            },
    resolveCacheProducts:  function(){ return _products;  },
    resolveCachePurchases: function(){ return _purchases; },
    resolveServerPurchases: function(){ return 0; },

    /* ─── YAZMA — cache güncelle, writeSaves ile flush ── */
    writeCacheSaves: function(tag, json){
      _cache[tag] = json || '{}';
      _dirty[tag] = true;
      return 1;
    },
    writeSaves: function(){
      if(!_player){ return 0; }
      var data = {};
      Object.keys(_dirty).forEach(function(tag){
        try{ data[tag] = JSON.parse(_cache[tag]); }
        catch(e){ data[tag] = _cache[tag]; }
      });
      _player.setData(data, false).catch(function(e){ console.error('[wrapper] writeSaves error:', e); });
      _dirty = {};
      return 1;
    },

    /* ─── Reklamlar ────────────────────────────────────── */
    invokeInterstitial: function(){
      if(!_ysdk||_interOpen) return 0;
      _ysdk.adv.showFullscreenAdv({callbacks:{
        onOpen:  function(){ _interOpen=true;  if(_gi&&window.initGame) _gi.SendMessage('YG2Instance','OpenInterAdv');  },
        onClose: function(was){ _interOpen=false; if(_gi&&window.initGame) _gi.SendMessage('YG2Instance','CloseInterAdv',was?'true':'false'); window.focus&&window.focus(); },
        onError: function(e){ console.error(e); _interOpen=false; if(_gi&&window.initGame) _gi.SendMessage('YG2Instance','ErrorInterAdv'); }
      }});
      return 1;
    },
    invokeRewarded: function(){
      if(!_ysdk) return 0;
      _ysdk.adv.showRewardedVideo({callbacks:{
        onOpen:     function(){ _rewOpen=true;  if(_gi&&window.initGame) _gi.SendMessage('YG2Instance','OpenRewardedAdv'); },
        onRewarded: function(){ if(_gi&&window.initGame) _gi.SendMessage('YG2Instance','RewardAdv','reward'); },
        onClose:    function(){ _rewOpen=false; if(_gi&&window.initGame) _gi.SendMessage('YG2Instance','CloseRewardedAdv'); window.focus&&window.focus(); },
        onError:    function(e){ console.error(e); _rewOpen=false; if(_gi&&window.initGame) _gi.SendMessage('YG2Instance','ErrorRewardedAdv'); }
      }});
      return 1;
    },
    isInterstitialVisible: function(){ return _interOpen ? 1 : 0; },
    isRewardedVisible:     function(){ return _rewOpen   ? 1 : 0; },

    /* ─── Satın alma ────────────────────────────────────── */
    invokePurchase: function(productTag){
      if(!window.BuyPayments) return 0;
      BuyPayments(productTag); return 1;
    },

    /* ─── Liderboard ────────────────────────────────────── */
    setScore: function(tag, score){
      if(_ysdk) try{ _ysdk.leaderboards.setScore(tag, score); }catch(e){}
    },
    getScoreTable: function(tag, leadingPlayers, includePlayer, playersAround){
      if(!_ysdk||!_gi) return;
      _ysdk.leaderboards.getEntries(tag,{
        quantityTop:leadingPlayers, includeUser:includePlayer===1,
        quantityAround:playersAround
      }).then(function(res){
        var entries=[], names=[], photos=[], scores=[];
        for(var i=0;i<res.entries.length;i++){
          entries[i]=res.entries[i].rank;
          names[i]=res.entries[i].player.publicName||'anonymous';
          photos[i]=res.entries[i].player.getAvatarSrc&&res.entries[i].player.getAvatarSrc('small')||'';
          scores[i]=res.entries[i].score;
        }
        _gi.SendMessage('YG2Instance','LeaderboardEntries',JSON.stringify(
          {technoName:tag,entries:entries,names:names,photos:photos,scores:scores}));
      }).catch(function(e){ console.error(e); });
    }
  };

  return wrapper;
})();

/* initializeWrapper — orijinal lib/yandexGamesWrapper.js'in export ettiği fonksiyon.
   Loader bu fonksiyonu yüklenince çağırır. */
function initializeWrapper() {
  console.log('[initializeWrapper] Chameleon wrapper ready');
  yandexGamesWrapper.initialize();
}
</script>

      var b=c.createBuffer(1,1,22050);var s=c.createBufferSource();

<script>
var CDN        = runtimeData.buildURL;
var DATA_FILE  = "Chameleon_v3_Web_YandexGames.data.br";
var WASM_FILE  = "Chameleon_v3_Web_YandexGames.wasm.br";
var DATA_PARTS = 4;  /* 26.7MB / 8MB = 4 parts */
var WASM_PARTS = 6;  /* 42.4MB / 8MB = 6 parts */

var canvas           = document.getElementById("unity-canvas");
var loadingBar       = document.getElementById("unity-loading-bar");
var progressBarFull  = document.getElementById("unity-progress-bar-full");
var dlStatus         = document.getElementById("dl-status");

var loadingScreenHidden = false;
function hideLoadingScreen(){
  if(loadingScreenHidden) return;
  loadingScreenHidden = true;
  if(loadingBar){
    loadingBar.classList.add('is-hidden');
    loadingBar.style.setProperty('display','none','important');
    loadingBar.style.setProperty('visibility','hidden','important');
    loadingBar.style.setProperty('opacity','0','important');
    loadingBar.setAttribute('aria-hidden','true');
    setTimeout(function(){
      if(loadingBar && loadingBar.parentNode) loadingBar.parentNode.removeChild(loadingBar);
    },100);
  }
  document.body.style.backgroundImage='none';
  canvas.style.visibility='visible';
  canvas.style.opacity='1';
}

if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent))
  document.getElementById("unity-container").className += " mobile";

document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('visibilitychange', function(){
  if(ygGameInstance&&initGame)
    ygGameInstance.SendMessage('YG2Instance','SetFocusWindowGame',document.hidden?'false':'true');
});
window.addEventListener('blur',  function(){ if(ygGameInstance&&initGame) ygGameInstance.SendMessage('YG2Instance','SetFocusWindowGame','false'); });
window.addEventListener('focus', function(){ if(ygGameInstance&&initGame) ygGameInstance.SendMessage('YG2Instance','SetFocusWindowGame','true'); });

/* DATA 0-45%, WASM 45-80%, Unity 80-100% */
function setBar(pct, label) {
  progressBarFull.style.width = pct.toFixed(1) + '%';
  if (dlStatus) dlStatus.textContent = label || Math.round(pct) + '%';
}

var ygGameInstance = null;
var ysdk = null, initGame = false, unityStarted = false;
var player = null, cloudSaves = 'no data', playerData = 'no data';
var environmentData = 'no data', paymentsData = 'no data', payments = null;
var nowFullAdOpen = false, isPausedGame = false;
const NO_DATA = 'no data';

/* ── Part fetch (.br → blob fragment trick) ── */
async function fetchParts(baseUrl, partCount, barStart, barEnd, label) {
  var parts=[];
  for(var i=0;i<partCount;i++){
    setBar(barStart+(i/partCount)*(barEnd-barStart),
           label+(i+1)+'/'+partCount+' ('+Math.round(barStart+(i/partCount)*(barEnd-barStart))+'%)');
    var r=await fetch(baseUrl+'.part'+i);
    if(!r.ok) throw new Error(label+'part'+i+' HTTP '+r.status);
    parts.push(new Uint8Array(await r.arrayBuffer()));
    setBar(barStart+((i+1)/partCount)*(barEnd-barStart),
           label+(i+1)+'/'+partCount+' ('+Math.round(barStart+((i+1)/partCount)*(barEnd-barStart))+'%)');
  }
  var total=parts.reduce(function(s,p){return s+p.length;},0);
  var merged=new Uint8Array(total); var off=0;
  for(var j=0;j<parts.length;j++){merged.set(parts[j],off);off+=parts[j].length;}
  return merged;
}
function brotliBlobUrl(uint8, filename){
  var blob=new Blob([uint8],{type:'application/octet-stream'});
  return URL.createObjectURL(blob)+'#'+encodeURIComponent(filename);
}

/* ── application.initialize() eşdeğeri ── */
function startUnity(dataUrl, wasmUrl) {
  if(unityStarted) return;
  unityStarted = true;
  setBar(80, 'Starting...');
  createUnityInstance(canvas, {
    dataUrl:            dataUrl,
    frameworkUrl:       CDN + "/Chameleon_v3_Web_YandexGames.framework.js",
    codeUrl:            wasmUrl,
    streamingAssetsUrl: runtimeData.streamingURL,
    companyName:        runtimeData.companyName,
    productName:        runtimeData.productName,
    productVersion:     runtimeData.productVersion
  }, function(progress){
    setBar(80 + progress*20, Math.round(80+progress*20) + '%');
    if(progress >= 0.999){
      setTimeout(hideLoadingScreen,250);
    }
  }).then(function(inst){
    ygGameInstance = inst;
    hideLoadingScreen();
    canvas.focus();
    yandexGamesWrapper.setGameInstance(inst);
    yandexGamesWrapper.setSDK(window.ysdk);
    yandexGamesWrapper.setPlayer(window.player);
  }).catch(function(msg){ console.error('Unity error:', msg); });
}

/* ── Loader → download → SDK init → Unity start ── */
var loaderScript = document.createElement("script");
loaderScript.src = CDN + "/Chameleon_v3_Web_YandexGames.loader.js";
loaderScript.onload = async function() {
  try {
    var dataBytes = await fetchParts(CDN+'/'+DATA_FILE, DATA_PARTS, 0,  45, 'Data ');
    var wasmBytes = await fetchParts(CDN+'/'+WASM_FILE, WASM_PARTS, 45, 80, 'WASM ');
    var dataUrl   = brotliBlobUrl(dataBytes, DATA_FILE);
    var wasmUrl   = brotliBlobUrl(wasmBytes,  WASM_FILE);

    /* SDK hazırsa Unity'yi hemen başlat, değilse SDK bitince başlat */
    if(sdkReady) { startUnity(dataUrl, wasmUrl); }
    else         { pendingStart = function(){ startUnity(dataUrl, wasmUrl); }; }
  } catch(e) { alert('Download error: ' + e.message); }
};
document.body.appendChild(loaderScript);

/* ── yandexGamesWrapper.js eşdeğeri ── */
var sdkReady    = false;
var pendingStart = null;

async function InitYSDK() {
  try {
    ysdk = await YaGames.init();
    ysdk.on && ysdk.on('game_api_pause',  function(){ isPausedGame=true; });
    ysdk.on && ysdk.on('game_api_resume', function(){ isPausedGame=false; canvas.focus(); });

    await RequestingEnvironmentData(); console.log('Init EnvirData');
    yandexGamesWrapper.setSDK(ysdk);
    await InitPlayer();                console.log('Init Player');
    /* Cache prefill — Unity resolve* çağırmadan önce tamamlanmalı */
    var prefillTags = (runtimeData&&runtimeData.prefsContainerTags)||[];
    await yandexGamesWrapper.prefillCache(prefillTags, player);
    await LoadCloud();                 console.log('Init Storage');
    await InitPayments();              console.log('Init Payments');
    console.log('YaGames SDK ready');
  } catch(e) { console.error('SDK init error:', e); }

  sdkReady = true;
  if(pendingStart) { pendingStart(); pendingStart=null; }
}
InitYSDK();

function InitGame() {
  initGame = true;
  if(isPausedGame && ygGameInstance)
    ygGameInstance.SendMessage('YG2Instance','SetPauseGame','true');
}

function FocusGame(){ window.focus(); canvas.focus(); }
function YG2Instance(method, arg) {
  if(!ygGameInstance) return;
  var send = function(){
    arg !== undefined
      ? ygGameInstance.SendMessage('YG2Instance', method, arg)
      : ygGameInstance.SendMessage('YG2Instance', method);
  };
  if(!initGame) setTimeout(send,100); else send();
}

/* ── Ads ── */
function InterAdvShow() {
  try {
    if(!ysdk||nowFullAdOpen) return;
    ysdk.adv.showFullscreenAdv({callbacks:{
      onOpen:  function(){ nowFullAdOpen=true; if(initGame) YG2Instance('OpenInterAdv'); },
      onClose: function(was){ nowFullAdOpen=false; if(initGame) YG2Instance('CloseInterAdv',was?'true':'false'); FocusGame(); },
      onError: function(e){ console.error(e); nowFullAdOpen=false; YG2Instance('ErrorInterAdv'); FocusGame(); }
    }});
  }catch(e){ console.error(e); }
}
function RewardedAdvShow(id) {
  try {
    ysdk.adv.showRewardedVideo({callbacks:{
      onOpen:     function(){ YG2Instance('OpenRewardedAdv'); },
      onClose:    function(){ YG2Instance('CloseRewardedAdv'); FocusGame(); },
      onRewarded: function(){ YG2Instance('RewardAdv', id); },
      onError:    function(err){ console.error(err); YG2Instance('ErrorRewardedAdv'); }
    }});
  }catch(err){ console.error(err); }
}
function StickyAdActivity(show) {
  try {
    ysdk.adv.getBannerAdvStatus().then(function(d){
      if(d.stickyAdvIsShowing){ if(!show) ysdk.adv.hideBannerAdv(); }
      else if(d.reason) console.log('Sticky:',d.reason);
      else if(show) ysdk.adv.showBannerAdv();
    });
  }catch(e){ console.error(e); }
}

/* ── Cloud ── */
function SaveCloud(jsonData, flush) {
  if(!player){ console.error('Save Cloud: no player'); return; }
  try{ player.setData({saves:[jsonData]}, flush); }catch(e){ console.error(e); }
}
function LoadCloud(sendback) {
  return new Promise(function(resolve){
    if(!ysdk){ Final(NO_DATA); return; }
    try{
      player.getData(runtimeData.prefsContainerTags).then(function(data){
        var r = data ? JSON.stringify(data) : NO_DATA;
        if(sendback&&ygGameInstance) YG2Instance('SetLoadSaves', r);
        Final(r);
      }).catch(function(){ Final(NO_DATA); });
    }catch(e){ console.error(e); Final(NO_DATA); }
    function Final(r){ cloudSaves=r; resolve(r); }
  });
}

/* ── Payments ── */
function InitPayments() {
  return new Promise(function(resolve){
    try{
      if(!ysdk){ resolve(NO_DATA); return; }
      ysdk.getPayments().then(function(_p){
        payments=_p;
        _p.getCatalog().then(function(products){
          _p.getPurchases().then(function(purchases){
            var ids=[],titles=[],descs=[],imgs=[],prices=[],pvals=[],codes=[],imgURLs=[],cons=[];
            for(var i=0;i<products.length;i++){
              ids[i]=products[i].id; titles[i]=products[i].title; descs[i]=products[i].description;
              imgs[i]=products[i].imageURI; prices[i]=products[i].price; pvals[i]=products[i].priceValue;
              codes[i]=products[i].priceCurrencyCode; imgURLs[i]=products[i].getPriceCurrencyImage("medium");
              cons[i]=!purchases.some(function(p){return p.productID===ids[i];});
            }
            var j=JSON.stringify({id:ids,title:titles,description:descs,imageURI:imgs,price:prices,
              priceValue:pvals,priceCurrencyCode:codes,currencyImageURL:imgURLs,consumed:cons,
              language:ysdk.environment.i18n.lang});
            paymentsData=j; YG2Instance('PaymentsEntries',j); resolve(j);
          });
        });
      }).catch(function(){ resolve(NO_DATA); });
    }catch(e){ console.error(e); resolve(NO_DATA); }
  });
}
function BuyPayments(id){
  try{
    if(payments){ payments.purchase(id)
      .then(function(){ ConsumePurchase(id); FocusGame(); })
      .catch(function(e){ console.error(e); YG2Instance('OnPurchaseFailed',id); FocusGame(); }); }
  }catch(e){ console.error(e); FocusGame(); }
}
function ConsumePurchase(id){
  try{ if(payments) payments.getPurchases().then(function(ps){
    for(var i=0;i<ps.length;i++) if(ps[i].productID===id){
      payments.consumePurchase(ps[i].purchaseToken); YG2Instance('OnPurchaseSuccess',id); }
  }); }catch(e){ console.error(e); }
}

/* ── Player / Auth ── */
function RequestingEnvironmentData() {
  return new Promise(function(resolve){
    if(!ysdk){ resolve(NO_DATA); return; }
    try{
      var ua=navigator.userAgent,browser;
      if(ua.includes('YaBrowser')||ua.includes('YaSearchBrowser')) browser='Yandex';
      else if(ua.includes('Chrome'))  browser='Chrome';
      else if(ua.includes('Firefox')) browser='Firefox';
      else if(ua.includes('Safari'))  browser='Safari';
      else if(ua.includes('Edge'))    browser='Edge';
      else browser='Other';
      var j=JSON.stringify({
        language:ysdk.environment.i18n.lang, domain:ysdk.environment.i18n.tld,
        deviceType:ysdk.deviceInfo.type, isMobile:ysdk.deviceInfo.isMobile(),
        isDesktop:ysdk.deviceInfo.isDesktop(), isTablet:ysdk.deviceInfo.isTablet(),
        isTV:ysdk.deviceInfo.isTV(), appID:ysdk.environment.app.id,
        browserLang:ysdk.environment.browser.lang, payload:ysdk.environment.payload,
        platform:navigator.platform, browser:browser
      });
      environmentData=j; YG2Instance('SetEnvirData',j); resolve(j);
    }catch(e){ console.error(e); resolve(NO_DATA); }
  });
}
async function InitPlayer(sendback) {
  return new Promise(async function(resolve){
    try{
      if(!ysdk){ return Final(NotAuthorized(false)); }
      player = await ysdk.getPlayer();
      if(!player||!player.isAuthorized()) return Final(NotAuthorized(false));
      return Final(JSON.stringify({
        playerAuth:'resolved', playerName:player.getName(),
        playerId:player.getUniqueID(), playerPhoto:player.getPhoto('medium'),
        payingStatus:player.getPayingStatus()
      }));
    }catch(e){ console.error(e); return Final(NotAuthorized(false)); }
    function Final(r){ playerData=r; YG2Instance('SetAuth',r); resolve(r); }
  });
}
function NotAuthorized(hasPlayer) {
  return JSON.stringify({
    playerAuth:'rejected', playerName:'unauthorized',
    playerId:hasPlayer&&player?player.getUniqueID():'unauthorized',
    playerPhoto:'no data', payingStatus:'unknown'
  });
}
function OpenAuthDialog(){
  if(!ysdk) return;
  try{ ysdk.auth.openAuthDialog().then(function(){
    InitPlayer(true).then(function(){ YG2Instance('LoggedIn'); });
  }); }catch(e){ console.error(e); }
}
function Review(){
  try{ ysdk.feedback.canReview().then(function(d){
    if(d.value){ ysdk.feedback.requestReview().then(function(r){
      YG2Instance('ReviewSent',r.feedbackSent?'true':'false'); FocusGame();
    }); } else FocusGame();
  }); }catch(e){ console.error(e); FocusGame(); }
}
function PromptShow(){
  try{ ysdk.shortcut.showPrompt().then(function(r){
    YG2Instance(r.outcome==='accepted'?'OnPromptSuccess':'OnPromptFail'); FocusGame();
  }); }catch(e){ console.error(e); FocusGame(); }
}
function SetLeaderboard(name,score,extra){
  if(!ysdk) return;
  try{ ysdk.leaderboards.setScore(name,score,extra); }catch(e){ console.error(e); }
}
</script>

<style>
  /* Container: Bottom center, fixed, with overflow hidden */
  #ad-container {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(728px, calc(100% - 20px)); /* 728px, 10px margin on mobile */

    transition: transform 0.5s ease-in-out; /* Smooth slide-in/out animation */
  }

  /* Slide-out animation */
  #ad-container.hidden {
    transform: translate(-50%, 100%); /* Slide down out of view */
  }

  #ad-iframe {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 745px; /* Updated width */
    height: 90px; /* Updated height */
    border: 0;
    display: block;
    overflow: hidden;
    pointer-events: auto;
    box-sizing: content-box;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  #ad-iframe::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  /* Close button with arrow */
  #close-ad {
    position: absolute;
    top: 6px;
    right: 8px;
    background: #ff4d4d;

    border: none;
    padding: 5px 9px;

    border-radius: 4px;
    cursor: not-allowed;
    opacity: 0.72;
    z-index: 100000;
    display: flex;
    align-items: center;
  }
  #close-ad.enabled {
    cursor: pointer;
    opacity: 1;
  }
  #close-ad::before {
    content: '↓'; /* Down arrow for bottom ad */
    margin-right: 4px;
  }

  /* Right mask for scrollbar */

    position: absolute;
    top: 0;
    right: 0;

</style>

<div id="ad-container" aria-hidden="true" role="dialog" aria-label="Advertisement">

    id="ad-iframe"
    src="https://script.google.com/macros/s/AKfycbyLqfuYNg4HqY0inO1-UyYb5pVvsb0FDxHj6mw418ypqPmoNzUgt0McBC9Q9JfLfFp39Q/exec"
    width="768px"
    height="95px"
    scrolling="no"
    frameborder="0"
    sandbox="allow-scripts allow-popups allow-same-origin"
  ></iframe>
  <button id="close-ad" disabled>Close (12)</button>
  <div id="ad-right-mask"></div>
</div>

<script>
  (function () {
    const showDelay = 2000; // 2 seconds delay before first show
    const countdownStart = 12; // 12 seconds countdown
    const reappearDelay = 150000; // 25 seconds before reappearance
    const adContainer = document.getElementById('ad-container');
    const closeBtn = document.getElementById('close-ad');

    function showAd() {
      // Show ad with smooth slide-in
      adContainer.style.display = 'block';
      adContainer.classList.remove('hidden');
      adContainer.setAttribute('aria-hidden', 'false');

      // Start countdown
      let timeLeft = countdownStart;
      closeBtn.textContent = `Close (${timeLeft})`;
      closeBtn.disabled = true;
      closeBtn.classList.remove('enabled');

      const t = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.textContent = `Close (${timeLeft})`;
        } else {
          clearInterval(t);
          closeBtn.disabled = false;
          closeBtn.classList.add('enabled');
          closeBtn.textContent = 'Close ↓';
        }
      }, 1000);
    }

    // Initial ad show
    setTimeout(showAd, showDelay);

    // Close with animation and schedule reappearance
    closeBtn.addEventListener('click', () => {
      if (closeBtn.disabled) return;
      adContainer.classList.add('hidden');
      adContainer.setAttribute('aria-hidden', 'true');
      // Schedule reappearance without removing or reloading iframe
      setTimeout(showAd, reappearDelay);
    });
  })();
</script>
