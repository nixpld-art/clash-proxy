<style>html{box-sizing:border-box}*,*:before,*:after{box-sizing:inherit}html,body{height:100%}canvas{display:block}body{margin:0}#unity-container{width:100%;height:100%;position:relative}#unity-canvas{width:100%;height:100%;background:#231F20}#loading-cover{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center}#unity-loading-bar{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;align-items:center}#unity-logo{text-align:center}#unity-logo img{max-width:80%;max-height:80%}#unity-progress-bar-empty{width:40%;height:24px;margin:10px 20px 20px 10px;text-align:left;border:1px solid white;padding:2px}#unity-progress-bar-full{width:0;height:100%;background:white}.light #unity-progress-bar-empty{border-color:black}.light #unity-progress-bar-full{background:black}.spinner,.spinner:after{border-radius:50%;width:5em;height:5em}.spinner{margin:10px;font-size:10px;position:relative;text-indent:-9999em;border-top:1.1em solid rgba(255,255,255,0.2);border-right:1.1em solid rgba(255,255,255,0.2);border-bottom:1.1em solid rgba(255,255,255,0.2);border-left:1.1em solid #ffffff;transform:translateZ(0);animation:spinner-spin 1.1s infinite linear}@keyframes spinner-spin{0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)}}</style>

    window.SDK_OPTIONS = {
        gameId: "r2tzpy9cgrn2u4xgzc9z0zbtvxm16mby",
        onEvent: function (a) {
            switch (a.name) {
                case "SDK_GAME_PAUSE":
                    break;

        }

            d.parentNode.insertBefore(e, d);
        }
    })(document, "script", "gamemonetize-sdk");
</script></head>
<body class="dark">
<div id="unity-container" class="unity-desktop">
<canvas id="unity-canvas"></canvas>
</div>
<div id="loading-cover" style="display:none;">
<div id="unity-loading-bar">
<div id="unity-progress-bar-empty" style="display: none;">
<div id="unity-progress-bar-full"></div>
</div>
<div class="spinner"></div>
</div>
</div>
<script>
  const hideFullScreenButton = "";
  const buildUrl = "https://cdn.jsdelivr.net/gh/lona-is/teach@1071ced60c298583950ac8214ef73fdf058ecdfa/data";
  const loaderUrl = buildUrl + "/test2.js";
  const config = {
    dataUrl: buildUrl + "/crash2d.js",
    frameworkUrl: buildUrl + "/crash2.js",
    codeUrl: buildUrl + "/crash2w.js",
    streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/lona-is/teach@1071ced60c298583950ac8214ef73fdf058ecdfa/data/sa",
  };

  const container = document.querySelector("#unity-container");
  const canvas = document.querySelector("#unity-canvas");
  const loadingCover = document.querySelector("#loading-cover");
  const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
  const progressBarFull = document.querySelector("#unity-progress-bar-full");
  const spinner = document.querySelector(".spinner");

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) container.className = "unity-mobile";
  loadingCover.style.display = "";
  document.addEventListener("contextmenu", e => e.preventDefault());
  function FocusGame(){ try{ window.focus(); canvas.focus(); }catch{} }
  window.addEventListener("pointerdown", FocusGame);
  window.addEventListener("touchstart",  FocusGame);

  let StartUnityInstance, myGameInstance;
  let ysdk = null;
  let initGame = false, nowFullAdOpen = false;
  var environmentData = 'null';
  var playerData      = 'noData';
  var cloudSaves      = 'noData';
  var paymentsData    = 'none';
  window.environmentData = environmentData;

  function GetPayments(){ console.warn("GetPayments is not implemented"); return Promise.resolve("none"); }
  let lastAdTime = 0;
  function canShowAd(){ return Date.now() - lastAdTime > 30000; }

  function FullAdShow(){
    if (!canShowAd()) { myGameInstance?.SendMessage('YandexGame','CloseFullAd','false'); return; }
    try{
      if (nowFullAdOpen) return;
      nowFullAdOpen = true;
      lastAdTime = Date.now();
      if (typeof sdk !== 'undefined' && typeof sdk.showBanner === 'function'){
        sdk.showBanner();
        setTimeout(()=>{ nowFullAdOpen=false; myGameInstance?.SendMessage('YandexGame','CloseFullAd','true'); FocusGame(); },3000);
      }else{
        nowFullAdOpen=false; myGameInstance?.SendMessage('YandexGame','CloseFullAd','false'); FocusGame();
      }
    }catch(e){
      nowFullAdOpen=false; myGameInstance?.SendMessage('YandexGame','CloseFullAd','false'); FocusGame();
    }
  }

  function RewardedShow(id){
    if (!canShowAd()){ myGameInstance?.SendMessage('YandexGame','RewardUnavailable'); return; }
    try{
      lastAdTime = Date.now();
      if (typeof sdk !== 'undefined' && typeof sdk.showBanner === 'function'){
        sdk.showBanner();
        setTimeout(()=>{ myGameInstance?.SendMessage('YandexGame','RewardVideo',id);
                          myGameInstance?.SendMessage('YandexGame','CloseVideo'); FocusGame(); },3000);
      }else{
        myGameInstance?.SendMessage('YandexGame','RewardVideo',id);
        myGameInstance?.SendMessage('YandexGame','CloseVideo'); FocusGame();
      }
    }catch(e){
      myGameInstance?.SendMessage('YandexGame','ErrorVideo'); FocusGame();
    }
  }

  const FORCED_LANG = 'en';
  try {
    Object.defineProperty(navigator,'language',{get:()=> 'en-US', configurable:true});
    Object.defineProperty(navigator,'languages',{get:()=> ['en-US','en'], configurable:true});
  } catch {}
  try { document.documentElement.lang = 'en'; } catch {}

  const APP_KEY = 'yg2_cloud_' + (location.host + location.pathname);
  let cache; try { cache = JSON.parse(localStorage.getItem(APP_KEY) || '{}'); } catch { cache = {}; }
  if (!Array.isArray(cache.saves)) { cache.saves = ["{}"]; try { localStorage.setItem(APP_KEY, JSON.stringify(cache)); } catch {} }
  function persist(){ try { localStorage.setItem(APP_KEY, JSON.stringify(cache)); } catch {} }

  const emuPlayer = {
    getMode:         () => 'full',
    getName:         () => 'Guest',
    getPhoto:        () => '',
    getUniqueID:     () => 'guest_' + (location.host || 'local'),
    getPayingStatus: () => 'unknown',
    setData: (obj, flush) => { if (obj && typeof obj==='object'){ cache = { ...cache, ...obj }; if (flush !== false) persist(); } },
    getData: (keys) => Promise.resolve(
      Array.isArray(keys) && keys.length ? keys.reduce((acc,k)=>{ acc[k]=cache[k]; return acc; }, {}) : { ...cache }
    )
  };

  window.YaGames = {
    init: () => Promise.resolve((function(){
      const isM = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const obj = {
        environment: { i18n:{ lang:FORCED_LANG, tld:'com' }, app:{ id:'stub.app.id' }, browser:{ lang:FORCED_LANG }, payload:null },
        deviceInfo:  { type:isM?'mobile':'desktop', isMobile:()=>isM, isDesktop:()=>!isM, isTablet:()=>/iPad|Tablet/i.test(navigator.userAgent), isTV:()=>false },
        features:    { LoadingAPI:{ ready(){} } },
        serverTime:  () => Date.now(),
        auth:        { openAuthDialog: () => Promise.resolve() },
        getPlayer:   () => Promise.resolve(emuPlayer),
        getPayments: () => Promise.reject(new Error('payments-unavailable')),
        getLeaderboards: () => Promise.reject(new Error('leaderboards-unavailable')),
      };
      window.ysdk = obj;
      return obj;
    })())
  };


function LanguageRequest(){try{myGameInstance.SendMessage('YandexGame','SetLanguage','en')}catch(e){}}function RequestingEnvironmentData(){try{let jsonEnvir={"language":'en',};myGameInstance.SendMessage('YandexGame','SetEnvironmentData',JSON.stringify(jsonEnvir))}catch(e){console.error('CRASH Requesting Environment Data: ',e.message)}} 

function StaticRBTDeactivate() {}
function InitSDK() {}
function GReadyAPI() {}

  function InitPlayer(sendback){
    return new Promise((resolve)=>{
      const data = JSON.stringify({
        playerAuth:'resolved',
        playerName: emuPlayer.getName(),
        playerId:   emuPlayer.getUniqueID(),
        playerPhoto: emuPlayer.getPhoto('small') || 'unknown',
        payingStatus: emuPlayer.getPayingStatus()
      });
      playerData = data;
      if (sendback) myGameInstance?.SendMessage('YandexGame','SetInitializationSDK', data);
      resolve(data);
    });
  }

  function LoadCloud(sendback){
    return new Promise((resolve)=>{
      emuPlayer.getData(['saves']).then(data=>{
        const res = (data && Array.isArray(data.saves)) ? JSON.stringify(data.saves) : JSON.stringify(["{}"]);
        cloudSaves = res;
        if (sendback) myGameInstance?.SendMessage('YandexGame','SetLoadSaves', res);
        resolve(res);
      }).catch(()=>{
        const res = JSON.stringify(["{}"]);
        cloudSaves = res;
        if (sendback) myGameInstance?.SendMessage('YandexGame','SetLoadSaves', res);
        resolve(res);
      });
    });
  }

  function SaveCloud(jsonData, flush){ try{ emuPlayer.setData({ saves:[jsonData] }, flush); }catch(e){ console.error('CRASH Save Cloud: ', e.message); } }
  function OpenAuthDialog(){ InitPlayer(true).then(()=>{ myGameInstance?.SendMessage('YandexGame','GetDataInvoke'); }); }

  window._InitEnvironmentData_js = function(sendback){ return RequestingEnvironmentData(sendback); };
  window._InitPlayer_js          = function(sendback){ return InitPlayer(sendback); };
  window._LoadCloud_js           = function(sendback){ return LoadCloud(sendback); };
  window._SaveCloud_js           = function(jsonData, flush){ try{ SaveCloud(jsonData, flush); }catch{} };

  (async function(){
    try{ await window.YaGames.init(); }catch{}
    const s = document.createElement("script");
    s.src = loaderUrl;
    s.onload = () => {
      StartUnityInstance = function(){
        createUnityInstance(canvas, config, (p)=>{
          spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = `${100*p}%`;
        }).then(async (u)=>{
          myGameInstance = u;
          loadingCover.style.display = "none";

          await RequestingEnvironmentData(true);
          await InitPlayer(true);
          await LoadCloud(true);
          myGameInstance.SendMessage('YandexGame','InitSDKComplete');

        }).catch(()=>{});
      };
      StartUnityInstance();
    };
    document.body.appendChild(s);
  })();

  
  function GetLeaderboardScores() {}
  function ConsumePurchases() {}
  function InitGame(){ initGame = true; if (nowFullAdOpen) myGameInstance?.SendMessage('YandexGame','OpenFullAd'); }
  function GameReadyAPI(){}
</script>
<script src="https://cdn.jsdelivr.net/gh/st39/sdk@main/api.js"></script>
</body>
</html>",
