  var SKIP = /^(https?:|data:|blob:|about:|javascript:|mailto:|#|\/\/)/i;

<script>
            var sounds = {};
            var soundVolumes = {};
            var currentSoundVolume = 1.0;
            var currentMusicVolume = 1.0;

            function setGlobalVolume(volumeSound, volumeMusic) {
                for (var key in sounds) {
                    if (!sounds[key]) continue;
                    var globalVolume = key.trim().includes('mus') ? volumeMusic : volumeSound;
                    var localVolume = soundVolumes[key];
                    if (localVolume === undefined) localVolume = 1.0;
                    sounds[key].volume(localVolume * globalVolume);
                }
            }

            function setCurrentSoundVolume(volume) {
                currentSoundVolume = volume;
                setGlobalVolume(volume, currentMusicVolume);
            }

            function setCurrentMusicVolume(volume) {
                currentMusicVolume = volume;
                setGlobalVolume(currentSoundVolume, volume);
            }

            function HowlerSoundOff() { setGlobalVolume(0, 0); }
            function HowlerSoundOn() { setGlobalVolume(currentSoundVolume, currentMusicVolume); }

            function openUrlInNewTab(url) { window.open(url, '_blank'); }
        </script>
<script src="https://cdn.jsdelivr.net/gh/classrooms-1/lawyer@main/playgama-bridge-unity.js"></script>
<script>
            (function () {
                var loader = document.getElementById('loader');
                var bar = document.getElementById('loader-bar');
                var fill = document.getElementById('loader-fill');
                var percent = document.getElementById('loader-percent');
                if (!loader || !bar || !fill || !percent) return;

                var target = 0;
                var shown = 0.01;
                var removed = false;
                var startedAt = performance.now();
                var lastFrameAt = startedAt;
                var tailStartedAt = 0;

                function render(value) {
                    var valuePercent = value * 100;
                    fill.style.width = valuePercent.toFixed(2) + '%';
                    percent.textContent = Math.round(valuePercent) + '%';
                    bar.setAttribute('aria-valuenow', Math.round(valuePercent));
                }

                function getGoal(now) {
                    var bootstrapSeconds = (now - startedAt) / 1000;
                    var bootstrapGoal = Math.min(0.12, 0.01 + bootstrapSeconds * 0.025);
                    var goal = Math.max(bootstrapGoal, Math.min(target, 0.9));

                    if (tailStartedAt > 0) {
                        var tailSeconds = (now - tailStartedAt) / 1000;
                        var tailGoal = 0.9 + 0.085 * (1 - Math.exp(-tailSeconds / 8));
                        goal = Math.max(goal, Math.min(tailGoal, 0.985));
                    }

                    return Math.min(goal, 0.985);
                }

                function removeLoader() {
                    if (removed) return;
                    removed = true;
                    if (loader.parentNode) loader.parentNode.removeChild(loader);
                }

                function tick(now) {
                    if (removed) return;

                    var deltaTime = Math.min(Math.max((now - lastFrameAt) / 1000, 0), 0.1);
                    lastFrameAt = now;
                    var goal = getGoal(now);
                    var distance = goal - shown;

                    if (distance > 0) {
                        var response = 1 - Math.exp(-7 * deltaTime);
                        var easedStep = distance * response;
                        var minimumStep = 0.008 * deltaTime;
                        var maximumStep = 0.55 * deltaTime;
                        var step = Math.min(distance, Math.min(maximumStep, Math.max(minimumStep, easedStep)));
                        shown += step;
                        render(shown);
                    }

                    requestAnimationFrame(tick);
                }

                render(shown);
                requestAnimationFrame(tick);

                var original = window.onUnityLoadingProgressChanged;
                window.onUnityLoadingProgressChanged = function (progress) {
                    var value = Number(progress);
                    if (Number.isFinite(value)) {
                        value = Math.max(0, Math.min(value, 1));
                        if (value > target) target = value;
                        if (value >= 0.9 && tailStartedAt === 0) {
                            tailStartedAt = performance.now();
                        }
                    }

                    if (typeof original === 'function') original.apply(this, arguments);
                };

                window.hideGameLoader = function () {
                    if (removed) return;
                    shown = 1;
                    render(shown);
                    setTimeout(removeLoader, 160);
                };

                window.isGameLoaderVisible = function () {
                    return removed ? 0 : 1;
                };

                setTimeout(function () { removeLoader(); }, 120000);
            })();
        </script>

<!-- Sticky Bottom Center Ad (728x90) with Smooth Slide-Out and Reappearance -->
<style>
  /* Container: Bottom center, fixed, with overflow hidden */
  #ad-container {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(728px, calc(100% - 20px)); /* 728px, 10px margin on mobile */
    height: 90px;
    background: rgba(0, 0, 0, 0.90);
    display: none;
    z-index: 99999;
    border-radius: 0; /* Sharp corners */
    overflow: hidden;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.45);
    box-sizing: border-box;
    transition: transform 0.5s ease-in-out; /* Smooth slide-in/out animation */
  }

  /* Slide-out animation */
  #ad-container.hidden {
    transform: translate(-50%, 100%); /* Slide down out of view */
  }

  #ad-iframe {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 745px; /* Updated width */
    height: 90px; /* Updated height */
    border: 0;
    display: block;
    overflow: hidden;
    pointer-events: auto;
    box-sizing: content-box;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  #ad-iframe::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  /* Close button with arrow */
  #close-ad {
    position: absolute;
    top: 6px;
    right: 8px;
    background: #ff4d4d;
    color: #fff;
    border: none;
    padding: 5px 9px;
    font-size: 13px;
    border-radius: 4px;
    cursor: not-allowed;
    opacity: 0.72;
    z-index: 100000;
    display: flex;
    align-items: center;
  }
  #close-ad.enabled {
    cursor: pointer;
    opacity: 1;
  }
  #close-ad::before {
    content: '↓'; /* Down arrow for bottom ad */
    margin-right: 4px;
  }

  /* Right mask for scrollbar */
  #ad-right-mask {
    position: absolute;
    top: 0;
    right: 0;
    width: 12px;
    height: 100%;
    pointer-events: none;
    background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.9));
    z-index: 99999;
  }

  /* Mobile adjustments */
  @media (max-width: 440px) {
    #ad-container {
      width: calc(100% - 12px);
      left: 50%;
      transform: translateX(-50%);
      border-radius: 0; /* Sharp corners on mobile */
    }
    #ad-iframe {
      width: 728px;
    }
  }
</style>

<div id="ad-container" aria-hidden="true" role="dialog" aria-label="Advertisement">
  <iframe
    id="ad-iframe"
    src="https://script.google.com/macros/s/AKfycbxLG5DHBe-sIbduDvwQZYJ3oaX_ha7rsvroprCFkQsnpZK_PEdipNia5ghxI_sdXYpv/exec"
    width="768px"
    height="95px"

    frameborder="0"
    sandbox="allow-scripts allow-popups allow-same-origin"
  ></iframe>
  <button id="close-ad" disabled>Close (12)</button>
  <div id="ad-right-mask"></div>
</div>

<script>
  (function () {
    const showDelay = 2000; // 2 seconds delay before first show
    const countdownStart = 12; // 12 seconds countdown
    const reappearDelay = 150000; // 25 seconds before reappearance
    const adContainer = document.getElementById('ad-container');
    const closeBtn = document.getElementById('close-ad');

    function showAd() {
      // Show ad with smooth slide-in
      adContainer.style.display = 'block';
      adContainer.classList.remove('hidden');
      adContainer.setAttribute('aria-hidden', 'false');

      // Start countdown
      let timeLeft = countdownStart;
      closeBtn.textContent = `Close (${timeLeft})`;
      closeBtn.disabled = true;
      closeBtn.classList.remove('enabled');

      const t = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.textContent = `Close (${timeLeft})`;
        } else {
          clearInterval(t);
          closeBtn.disabled = false;
          closeBtn.classList.add('enabled');
          closeBtn.textContent = 'Close ↓';
        }
      }, 1000);
    }

    // Initial ad show
    setTimeout(showAd, showDelay);

    // Close with animation and schedule reappearance
    closeBtn.addEventListener('click', () => {
      if (closeBtn.disabled) return;
      adContainer.classList.add('hidden');
      adContainer.setAttribute('aria-hidden', 'true');
      // Schedule reappearance without removing or reloading iframe
      setTimeout(showAd, reappearDelay);
    });
  })();
</script>
