<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/unbilgicox/barbi@main/TemplateData/favicon.ico"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/unbilgicox/barbi@main/TemplateData/style.css"/>
<script>
var CDN        = "https://cdn.jsdelivr.net/gh/unbilgicox/barbi@main";
var DATA_PARTS = 4;
var WASM_PARTS = 5;
var LANG       = "en";

function U(p){ return CDN ? (CDN.replace(/\/+$/,"") + "/" + p) : p; }

(function(){
  var LS="ya_player_data", LSS="ya_player_stats";
  function rd(k,f){ try{ return JSON.parse(localStorage.getItem(k)||f); }catch(e){ return JSON.parse(f); } }
  function wr(k,o){ try{ localStorage.setItem(k,JSON.stringify(o)); }catch(e){} }
  var pdata=rd(LS,"{}"), pstats=rd(LSS,"{}");
  var isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  function cb(o,n,a){ try{ if(o&&o.callbacks&&typeof o.callbacks[n]==="function") o.callbacks[n](a); }catch(e){} }

  var player={
    getUniqueID:function(){ return "local-player"; },
    getName:function(){ return pdata.__name || "Player"; },
    getPhoto:function(){ return ""; },
    getMode:function(){ return "lite"; },
    getIDsPerGame:function(){ return Promise.resolve([]); },
    getData:function(){ return Promise.resolve(JSON.parse(JSON.stringify(pdata))); },
    setData:function(d){ pdata=Object.assign(pdata,d||{}); wr(LS,pdata); return Promise.resolve(); },
    getStats:function(){ return Promise.resolve(JSON.parse(JSON.stringify(pstats))); },
    setStats:function(d){ pstats=Object.assign(pstats,d||{}); wr(LSS,pstats); return Promise.resolve(); },
    incrementStats:function(d){
      Object.keys(d||{}).forEach(function(k){ pstats[k]=(+pstats[k]||0)+(+d[k]||0); });
      wr(LSS,pstats); return Promise.resolve(JSON.parse(JSON.stringify(pstats)));
    },
    signIn:function(){ return Promise.reject(new Error("no auth")); }
  };

  var leaderboards={
    getLeaderboardDescription:function(n){ return Promise.resolve({ name:n, "default":true, entry_style:{}, description:{ invert_sort_order:false, score_format:{ type:"numeric" }, type:"numeric" } }); },
    setLeaderboardScore:function(){ return Promise.resolve(); },
    getLeaderboardPlayerEntry:function(){ return Promise.reject(new Error("no entry")); },
    getLeaderboardEntries:function(){ return Promise.resolve({ leaderboard:{}, ranges:[], userRank:0, entries:[] }); }
  };

  var ysdk={
    environment:{
      app:{ id:"0" },
      browser:{ lang:LANG },
      i18n:{ lang:LANG, tld:"com" },
      payload:null,
      isTelegram:false
    },
    deviceInfo:{
      type:isMobile?"mobile":"desktop",
      isMobile:function(){ return isMobile; },
      isDesktop:function(){ return !isMobile; },
      isTablet:function(){ return false; },
      isTV:function(){ return false; }
    },
    adv:{
      showFullscreenAdv:function(o){ cb(o,"onOpen"); setTimeout(function(){ cb(o,"onClose",false); },300); },
      showRewardedVideo:function(o){
        cb(o,"onOpen");
        setTimeout(function(){ cb(o,"onRewarded"); setTimeout(function(){ cb(o,"onClose"); },120); },400);
      },
      showBannerAdv:function(){ return Promise.resolve({ stickyAdvIsShowing:false, reason:"UNKNOWN" }); },
      hideBannerAdv:function(){ return Promise.resolve({ stickyAdvIsShowing:false }); },
      getBannerAdvStatus:function(){ return Promise.resolve({ stickyAdvIsShowing:false }); }
    },
    features:{
      LoadingAPI:{ ready:function(){} },
      GameplayAPI:{ start:function(){}, stop:function(){} }
    },
    screen:{
      fullscreen:{
        get status(){ return document.fullscreenElement ? "on" : "off"; },
        request:function(){ try{ (document.documentElement.requestFullscreen||function(){}).call(document.documentElement); }catch(e){} return Promise.resolve(); },
        exit:function(){ try{ if(document.exitFullscreen) document.exitFullscreen(); }catch(e){} return Promise.resolve(); }
      }
    },
    feedback:{
      canReview:function(){ return Promise.resolve({ value:false, reason:"NO_AUTH" }); },
      requestReview:function(){ return Promise.resolve({ feedbackSent:false }); }
    },
    clipboard:{ writeText:function(t){ try{ return navigator.clipboard.writeText(t); }catch(e){ return Promise.resolve(); } } },
    shortcut:{
      canShowPrompt:function(){ return Promise.resolve({ canShow:false }); },
      showPrompt:function(){ return Promise.resolve({ outcome:"rejected" }); }
    },
    getPlayer:function(){ return Promise.resolve(player); },
    getLeaderboards:function(){ return Promise.resolve(leaderboards); },
    getPayments:function(){ return Promise.reject(new Error("payments unavailable")); },
    getFlags:function(){ return Promise.resolve({}); },
    getStorage:function(){ return Promise.resolve(window.localStorage); },
    isAvailableMethod:function(){ return Promise.resolve(false); },
    dispatchEvent:function(){ return Promise.resolve(); },
    onEvent:function(){ return function(){}; },
    on:function(){ return function(){}; },
    off:function(){},
    EVENT:{ EXIT:"EXIT", HISTORY_BACK:"HISTORY_BACK" },
    exit:function(){ return Promise.resolve(); }
  };

  function deep(){
    var f=function(){ return Promise.resolve(true); };
    return new Proxy(f,{
      get:function(t,p){
        if(p==="then"||p==="catch"||p==="finally") return undefined;
        if(p===Symbol.toPrimitive) return function(){ return 0; };
        if(p==="toString") return function(){ return ""; };
        return deep();
      },
      apply:function(){ return Promise.resolve(true); }
    });
  }
  var proxied=new Proxy(ysdk,{
    get:function(t,p){
      if(p==="then"||p==="catch"||p==="finally") return undefined;
      if(p in t) return t[p];
      if(typeof p==="symbol") return undefined;
      return deep();
    }
  });

  window.YaGames={ init:function(){ return Promise.resolve(proxied); } };
  window.ysdk=proxied;

  window.environmentData = JSON.stringify({
    language:LANG, domain:"com", deviceType:isMobile?"mobile":"desktop",
    isMobile:isMobile, isDesktop:!isMobile, isTablet:false, isTV:false,
    appID:"0", browserLang:LANG, payload:"", promptCanShow:false, reviewCanShow:false,
    platform:navigator.platform, browser:"Chrome"
  });
  window.playerData = JSON.stringify({ id:"local-player", name:"Player", photo:"", isAuthorized:false, uniqueID:"local-player" });
  window.cloudSaves = "";
  window.paymentsData = "[]";
  window.leaderboardData = "";
})();
</script>
</head>
<body>
<div id="unity-container" style="position: absolute; width: 100%; height: 100%; left: 0%; top: 0%;">
<canvas id="unity-canvas" style="position: absolute; width: 100%; height: 100%"></canvas>
<div id="unity-loading-bar">
<div id="unity-logo"></div>
<div id="unity-progress-bar-empty">
<div id="unity-progress-bar-full"></div>
</div>
</div>
<div id="unity-warning"> </div>
</div>
<script>
YaGames.init().then(function(sdk){
  window.ysdk = sdk;
  return initPlayer();
});

var player;
function initPlayer(){
  return ysdk.getPlayer({ scopes:false }).then(function(_player){
    player = _player;
    return player;
  });
}
</script>
<script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }
      var buildUrl = U("Build");
      var loaderUrl = buildUrl + "/granny-1-barbie.loader.js";
      var config = {
        dataUrl: buildUrl + "/granny-1-barbie.data",
        frameworkUrl: buildUrl + "/granny-1-barbie.framework.js",
        codeUrl: buildUrl + "/granny-1-barbie.wasm",
        streamingAssetsUrl: U("StreamingAssets"),
        companyName: "Anastasia Kazantseva",
        productName: "Granny",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }
      loadingBar.style.display = "block";
      var myGameInstance = null;

      var mergedBytes = 0, totalParts = DATA_PARTS + WASM_PARTS, donePartsCount = 0;
      async function mergeParts(name, count, mime){
        var chunks = [], total = 0;
        for(var i = 0; i < count; i++){
          var r = await fetch(buildUrl + "/" + name + ".part" + i);
          if(!r.ok) throw new Error(name + ".part" + i + " " + r.status);
          var u = new Uint8Array(await r.arrayBuffer());
          chunks.push(u); total += u.length;
          donePartsCount++;
          progressBarFull.style.width = (donePartsCount / totalParts * 40) + "%";
        }
        var merged = new Uint8Array(total), off = 0;
        for(var j = 0; j < chunks.length; j++){ merged.set(chunks[j], off); off += chunks[j].length; }
        return URL.createObjectURL(new Blob([merged], { type: mime }));
      }

      var loaderReady = false, filesReady = false, started = false;
      function boot(){
        if(started || !loaderReady || !filesReady) return;
        started = true;
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (40 + 60 * progress) + "%";
        }).then((unityInstance) => {
          myGameInstance = unityInstance;
          window.unityInstance = unityInstance;
          loadingBar.style.display = "none";
        }).catch((message) => {
          console.error(message);
        });
      }

      (async function(){
        try{
          config.codeUrl = await mergeParts("granny-1-barbie.wasm", WASM_PARTS, "application/wasm");
          config.dataUrl = await mergeParts("granny-1-barbie.data", DATA_PARTS, "application/octet-stream");
          filesReady = true;
          boot();
        }catch(e){ console.error(e); }
      })();

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => { loaderReady = true; boot(); };
      document.body.appendChild(script);
    </script>

    <!-- Sticky Bottom Center Ad (728x90) with Smooth Slide-Out and Reappearance -->
<style>
  /* Container: Bottom center, fixed, with overflow hidden */
  #ad-container {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(728px, calc(100% - 20px)); /* 728px, 10px margin on mobile */
    height: 90px;
    background: rgba(0, 0, 0, 0.90);
    display: none;
    z-index: 99999;
    border-radius: 0; /* Sharp corners */
    overflow: hidden;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.45);
    box-sizing: border-box;
    transition: transform 0.5s ease-in-out; /* Smooth slide-in/out animation */
  }

  /* Slide-out animation */
  #ad-container.hidden {
    transform: translate(-50%, 100%); /* Slide down out of view */
  }

  #ad-iframe {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 745px; /* Updated width */
    height: 90px; /* Updated height */
    border: 0;
    display: block;
    overflow: hidden;
    pointer-events: auto;
    box-sizing: content-box;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  #ad-iframe::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  /* Close button with arrow */
  #close-ad {
    position: absolute;
    top: 6px;
    right: 8px;
    background: #ff4d4d;
    color: #fff;
    border: none;
    padding: 5px 9px;
    font-size: 13px;
    border-radius: 4px;
    cursor: not-allowed;
    opacity: 0.72;
    z-index: 100000;
    display: flex;
    align-items: center;
  }
  #close-ad.enabled {
    cursor: pointer;
    opacity: 1;
  }
  #close-ad::before {
    content: '↓'; /* Down arrow for bottom ad */
    margin-right: 4px;
  }

  /* Right mask for scrollbar */
  #ad-right-mask {
    position: absolute;
    top: 0;
    right: 0;
    width: 12px;
    height: 100%;
    pointer-events: none;
    background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.9));
    z-index: 99999;
  }

  /* Mobile adjustments */
  @media (max-width: 440px) {
    #ad-container {
      width: calc(100% - 12px);
      left: 50%;
      transform: translateX(-50%);
      border-radius: 0; /* Sharp corners on mobile */
    }
    #ad-iframe {
      width: 728px;
    }
  }
</style>

<div id="ad-container" aria-hidden="true" role="dialog" aria-label="Advertisement">
  <iframe
    id="ad-iframe"
    src="https://script.google.com/macros/s/AKfycbwO0_-Mbrs-AoE1MqbBxyaIzK385M7xGx4jDkq-FDsbR9wNcqft1m3554Np5XINfbRViw/exec"
    width="768px"
    height="95px"
    scrolling="no"
    frameborder="0"
    sandbox="allow-scripts allow-popups allow-same-origin"
  ></iframe>
  <button id="close-ad" disabled>Close (12)</button>
  <div id="ad-right-mask"></div>
</div>

<script>
  (function () {
    const showDelay = 2000; // 2 seconds delay before first show
    const countdownStart = 12; // 12 seconds countdown
    const reappearDelay = 150000; // 25 seconds before reappearance
    const adContainer = document.getElementById('ad-container');
    const closeBtn = document.getElementById('close-ad');

    function showAd() {
      // Show ad with smooth slide-in
      adContainer.style.display = 'block';
      adContainer.classList.remove('hidden');
      adContainer.setAttribute('aria-hidden', 'false');

      // Start countdown
      let timeLeft = countdownStart;
      closeBtn.textContent = `Close (${timeLeft})`;
      closeBtn.disabled = true;
      closeBtn.classList.remove('enabled');

      const t = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.textContent = `Close (${timeLeft})`;
        } else {
          clearInterval(t);
          closeBtn.disabled = false;
          closeBtn.classList.add('enabled');
          closeBtn.textContent = 'Close ↓';
        }
      }, 1000);
    }

    // Initial ad show
    setTimeout(showAd, showDelay);

    // Close with animation and schedule reappearance
    closeBtn.addEventListener('click', () => {
      if (closeBtn.disabled) return;
      adContainer.classList.add('hidden');
      adContainer.setAttribute('aria-hidden', 'true');
      // Schedule reappearance without removing or reloading iframe
      setTimeout(showAd, reappearDelay);
    });
  })();
</script>

</body>
