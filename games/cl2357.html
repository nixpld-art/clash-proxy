<script>
(function () {
  var CDN = "https://cdn.jsdelivr.net/gh/papamamia/aua@main/new4/";
  window.GAME_CDN = CDN;
  window.GAME_PLATFORM_ID = "crazy_games";
  window.adsbygoogle = window.adsbygoogle || [];
  window.adConfig = window.adConfig || function () {};
  window.adBreak = window.adBreak || function (o) {
    try { o && o.beforeAd && o.beforeAd(); } catch (e) {}
    try { o && o.adBreakDone && o.adBreakDone({ breakStatus: "noAdPreloaded" }); } catch (e) {}
    try { o && o.afterAd && o.afterAd(); } catch (e) {}
  };

  try {
    if (!document.querySelector("base")) {
      var b = document.createElement("base");
      b.href = CDN;
      document.head.insertBefore(b, document.head.firstChild);
    }
  } catch (e) {}

  var SKIP = /^(https?:|data:|blob:|about:|javascript:|mailto:|#|\/\/)/i;
  function abs(u) {
    if (u == null) return u;
    var s = String(u);
    if (!s || SKIP.test(s)) return s;
    if (s.charAt(0) === "/") s = s.slice(1);
    if (s.slice(0, 2) === "./") s = s.slice(2);
    return CDN + s;
  }
  window.GAME_ABS = abs;

  function patchSrc(ctor) {
    if (!ctor || !ctor.prototype) return;
    var d = Object.getOwnPropertyDescriptor(ctor.prototype, "src");
    if (!d || !d.set) return;
    Object.defineProperty(ctor.prototype, "src", {
      configurable: true,
      enumerable: d.enumerable,
      get: function () { return d.get ? d.get.call(this) : ""; },
      set: function (v) { d.set.call(this, abs(v)); }
    });
  }
  patchSrc(window.HTMLImageElement);
  patchSrc(window.HTMLMediaElement);
  patchSrc(window.HTMLSourceElement);
  patchSrc(window.HTMLScriptElement);
  patchSrc(window.HTMLLinkElement);

  var setAttr = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function (n, v) {
    if (n === "src" || n === "href") v = abs(v);
    return setAttr.call(this, n, v);
  };

  if (window.fetch) {
    var f = window.fetch;
    window.fetch = function (input, init) {
      if (typeof input === "string") input = abs(input);
      else if (input && input.url && typeof Request === "function") {
        var m = abs(input.url);
        if (m !== input.url) input = new Request(m, input);
      }
      return f.call(window, input, init);
    };
  }

  var xhrOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, u) {
    var a = [].slice.call(arguments);
    a[1] = abs(u);
    return xhrOpen.apply(this, a);
  };
})();
</script>

<!-- Sticky Bottom Center Ad (728x90) with Smooth Slide-Out and Reappearance -->
<style>
  /* Container: Bottom center, fixed, with overflow hidden */
  #ad-container {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(728px, calc(100% - 20px)); /* 728px, 10px margin on mobile */
    height: 90px;
    background: rgba(0, 0, 0, 0.90);
    display: none;
    z-index: 99999;
    border-radius: 0; /* Sharp corners */
    overflow: hidden;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.45);
    box-sizing: border-box;
    transition: transform 0.5s ease-in-out; /* Smooth slide-in/out animation */
  }

  /* Slide-out animation */
  #ad-container.hidden {
    transform: translate(-50%, 100%); /* Slide down out of view */
  }

  #ad-iframe {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 745px; /* Updated width */
    height: 90px; /* Updated height */
    border: 0;
    display: block;
    overflow: hidden;
    pointer-events: auto;
    box-sizing: content-box;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  #ad-iframe::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  /* Close button with arrow */
  #close-ad {
    position: absolute;
    top: 6px;
    right: 8px;
    background: #ff4d4d;
    color: #fff;
    border: none;
    padding: 5px 9px;
    font-size: 13px;
    border-radius: 4px;
    cursor: not-allowed;
    opacity: 0.72;
    z-index: 100000;
    display: flex;
    align-items: center;
  }
  #close-ad.enabled {
    cursor: pointer;
    opacity: 1;
  }
  #close-ad::before {
    content: '↓'; /* Down arrow for bottom ad */
    margin-right: 4px;
  }

  /* Right mask for scrollbar */
  #ad-right-mask {
    position: absolute;
    top: 0;
    right: 0;
    width: 12px;
    height: 100%;
    pointer-events: none;
    background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.9));
    z-index: 99999;
  }

  /* Mobile adjustments */
  @media (max-width: 440px) {
    #ad-container {
      width: calc(100% - 12px);
      left: 50%;
      transform: translateX(-50%);
      border-radius: 0; /* Sharp corners on mobile */
    }
    #ad-iframe {
      width: 728px;
    }
  }
</style>

<div id="ad-container" aria-hidden="true" role="dialog" aria-label="Advertisement">
  <iframe
    id="ad-iframe"
    src="https://script.google.com/macros/s/AKfycbxLG5DHBe-sIbduDvwQZYJ3oaX_ha7rsvroprCFkQsnpZK_PEdipNia5ghxI_sdXYpv/exec"
    width="768px"
    height="95px"
    scrolling="no"
    frameborder="0"
    sandbox="allow-scripts allow-popups allow-same-origin"
  ></iframe>
  <button id="close-ad" disabled>Close (12)</button>
  <div id="ad-right-mask"></div>
</div>

<script>
  (function () {
    const showDelay = 2000; // 2 seconds delay before first show
    const countdownStart = 12; // 12 seconds countdown
    const reappearDelay = 150000; // 25 seconds before reappearance
    const adContainer = document.getElementById('ad-container');
    const closeBtn = document.getElementById('close-ad');

    function showAd() {
      // Show ad with smooth slide-in
      adContainer.style.display = 'block';
      adContainer.classList.remove('hidden');
      adContainer.setAttribute('aria-hidden', 'false');

      // Start countdown
      let timeLeft = countdownStart;
      closeBtn.textContent = `Close (${timeLeft})`;
      closeBtn.disabled = true;
      closeBtn.classList.remove('enabled');

      const t = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.textContent = `Close (${timeLeft})`;
        } else {
          clearInterval(t);
          closeBtn.disabled = false;
          closeBtn.classList.add('enabled');
          closeBtn.textContent = 'Close ↓';
        }
      }, 1000);
    }

    // Initial ad show
    setTimeout(showAd, showDelay);

    // Close with animation and schedule reappearance
    closeBtn.addEventListener('click', () => {
      if (closeBtn.disabled) return;
      adContainer.classList.add('hidden');
      adContainer.setAttribute('aria-hidden', 'true');
      // Schedule reappearance without removing or reloading iframe
      setTimeout(showAd, reappearDelay);
    });
  })();
</script>
