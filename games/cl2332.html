<script>
/* ── WASM crash guvenlik agi ───────────────────────────────
   NOT: Asil hata (Animal_RayCasting/Swimming/Falling icindeki
   sifira bolme) wasm binary'sinde kalici olarak yamalandi.
   Bu blok artik sadece guvenlik agi: beklenmedik baska bir
   WASM trap olursa kullaniciya mesaj gosterip otomatik yeniler.
   (Onceki surumde bu kod <script> etiketi disinda kaldigi icin
   hic calismiyordu — duzeltildi.) */
window.addEventListener('error', function(e) {
  if (e.message && (
    e.message.includes('remainder by zero') ||
    e.message.includes('integer divide by zero') ||
    e.message.includes('RuntimeError')
  )) {
    console.error('[Dragon] WASM trap caught — auto-reload in 3s:', e.message);

    /* Overlay göster */
    var overlay = document.createElement('div');
    Object.assign(overlay.style, {
      position:'fixed', top:'0', left:'0', width:'100%', height:'100%',
      background:'rgba(0,0,0,0.82)', color:'#fff', zIndex:'99999',
      display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center',
      fontFamily:'sans-serif', textAlign:'center', padding:'20px', boxSizing:'border-box'
    });
    overlay.innerHTML =
      '<div style="font-size:22px;margin-bottom:12px;">⚠️ Game crashed</div>' +
      '<div style="font-size:14px;opacity:.7;margin-bottom:20px;">The game encountered an error and will restart automatically.</div>' +
      '<div id="crash-timer" style="font-size:18px;color:#38bdf8;">Reloading in 3...</div>';
    document.body.appendChild(overlay);

    var countdown = 3;
    var timer = setInterval(function(){
      countdown--;
      var el = document.getElementById('crash-timer');
      if(el) el.textContent = 'Reloading in ' + countdown + '...';
      if(countdown <= 0){
        clearInterval(timer);
        window.location.reload();
      }
    }, 1000);

    e.preventDefault();
    return true;
  }
});
</script>

var DATA_PARTS = 6;  /* 44.1MB / 8MB = 6 parts */

var container        = document.querySelector("#unity-container");

/* DATA 0-45%, WASM 45-70%, Unity 70-100% */
function setBar(pct, label) {
  progressBarFull.style.width = pct.toFixed(1) + '%';
  if (dlStatus) dlStatus.textContent = label || Math.round(pct) + '%';
}

let StartUnityInstance;
let ygGameInstance = null;
let ysdk = null, initYSDK = false, initGame = false, syncInit = false;
let isVisibility = true, isPausedGame = false;
let nowFullAdOpen = false, unityStarted = false;
let player = null, reviewData = 'false';
var cloudSaves = 'no data', environmentData = 'no data', playerData = 'no data';
const NO_DATA = 'no data';

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => SetVisibility(!document.hidden));
window.addEventListener('blur',  () => SetVisibility(false));
window.addEventListener('focus', () => SetVisibility(true));
window.addEventListener('pointerdown', () => { FocusGame(); SetVisibility(true); });
/* requestPointerLock removed: sandboxed iframe SecurityError */

function InstallBlurFocusBlocker(){
  if(!('onblur' in document)||window.blurFocusHandlersInstalled) return;
  window.addEventListener('blur',function(){
    var btn=document.createElement('button');
    Object.assign(btn.style,{position:'fixed',top:'0',left:'0',width:'100%',height:'100%',
      zIndex:'9999',backgroundColor:'rgba(0,0,0,0)',border:'none',cursor:'default'});
    document.body.appendChild(btn);
    window.addEventListener('focus',function rem(){
      btn.parentNode&&btn.parentNode.removeChild(btn);
      window.removeEventListener('focus',rem);
    });
  });
  window.blurFocusHandlersInstalled=true;
}
function FocusGame(){ canvas.focus(); }


function SetVisibility(v){
  if(ysdk!==null&&initGame===true&&isVisibility!==v){
    isVisibility=v; YG2Instance('SetFocusWindowGame',v?'true':'false');
  }
}
const PauseCallback  = () => { isPausedGame=true;  YG2Instance('SetPauseGame','true'); };
const ResumeCallback = () => { isPausedGame=false; YG2Instance('SetPauseGame','false'); };

/* ── Part fetch (.br → blob fragment trick) ── */
async function fetchParts(baseUrl, partCount, barStart, barEnd, label) {
  var parts=[];
  for(var i=0;i<partCount;i++){
    setBar(barStart+(i/partCount)*(barEnd-barStart),
           label+(i+1)+'/'+partCount+' ('+Math.round(barStart+(i/partCount)*(barEnd-barStart))+'%)');
    var r=await fetch(baseUrl+'.part'+i);
    if(!r.ok) throw new Error(label+'part'+i+' HTTP '+r.status);
    parts.push(new Uint8Array(await r.arrayBuffer()));
    setBar(barStart+((i+1)/partCount)*(barEnd-barStart),
           label+(i+1)+'/'+partCount+' ('+Math.round(barStart+((i+1)/partCount)*(barEnd-barStart))+'%)');
    console.log('['+label.trim()+'] part'+i+': '+parts[parts.length-1].length+' bytes');
  }
  var total=parts.reduce(function(s,p){return s+p.length;},0);
  var merged=new Uint8Array(total); var off=0;
  for(var j=0;j<parts.length;j++){merged.set(parts[j],off);off+=parts[j].length;}
  return merged;
}
function brotliBlobUrl(uint8, filename){
  var blob=new Blob([uint8],{type:'application/octet-stream'});
  return URL.createObjectURL(blob)+'#'+encodeURIComponent(filename);
}

/* ── Loader ── */
var script=document.createElement("script");
script.src=buildUrl+"/236ca43eb0dbc47d5f8ce65817a3785e.loader.js";
script.onload=async function(){
  try{
    var dataBytes=await fetchParts(buildUrl+'/'+DATA_FILE, DATA_PARTS, 0,  45, 'Data ');
    var wasmBytes=await fetchParts(buildUrl+'/'+WASM_FILE, WASM_PARTS, 45, 70, 'WASM ');

    StartUnityInstance=function(){
      setBar(70,'Starting...');
      createUnityInstance(canvas,{
        dataUrl:            brotliBlobUrl(dataBytes, DATA_FILE),
        frameworkUrl:       buildUrl+"/f66fe146c890ccca40712e032fa384a5.framework.js",
        codeUrl:            brotliBlobUrl(wasmBytes,  WASM_FILE),
        symbolsUrl:         buildUrl+"/d50f74577d7317a57fabcfe6ec3c24eb.symbols.json",
        streamingAssetsUrl: "StreamingAssets",
        companyName:        "CyberGoldfinch",
        productName:        "Dragon Simulator 3D",
        productVersion:     "1.1055"
      },function(progress){
        spinner.style.display="none";
        progressBarEmpty.style.display="";
        setBar(70+progress*30, Math.round(70+progress*30)+'%');
      }).then(function(inst){
        ygGameInstance=inst;
        loadingCover.style.background="";
        loadingCover.style.display="none";
        FocusGame();
        /* NOT: eski SendMessage "water layer" yamasi kaldirildi —
           sifira bolme hatasi artik dogrudan wasm icinde duzeltildi. */
      }).catch(function(msg){console.error(msg);});
    };
  }catch(e){ alert('Download error: '+e.message); return; }

  InstallBlurFocusBlocker();
  InitYSDK();
  if(IsLocalHost()||syncInit) StartUnityInstance_IfUnloaded();
};
document.body.appendChild(script);

function StartUnityInstance_IfUnloaded(){
  if(!unityStarted&&typeof StartUnityInstance==='function'){
    unityStarted=true; StartUnityInstance();
  }
}
function IsLocalHost(){
  try{
    if(window.top!==window) return false;
    var h=window.location.hostname;
    if(h==="localhost"||h==="127.0.0.1"||h.endsWith(".local")){ LogStyledMessage("Local Host"); return true; }
  }catch(e){return false;}
}
function YG2Instance(method,arg){
  if(!ygGameInstance) return;
  var send=()=>arg!==undefined
    ?ygGameInstance.SendMessage('YG2Instance',method,arg)
    :ygGameInstance.SendMessage('YG2Instance',method);
  if(!initGame) setTimeout(send,100); else send();
}
function LogStyledMessage(msg){ console.log('%c'+msg,'color:#FFDF73;background-color:#454545'); }

async function InitYSDK(){
  try{
    if(IsLocalHost()) return;
    ysdk=await YaGames.init();
    ysdk.on('game_api_pause',PauseCallback);
    ysdk.on('game_api_resume',ResumeCallback);
    await RequestingEnvironmentData(); LogStyledMessage('Init EnvirData ysdk');
    await InitPlayer();                LogStyledMessage('Init Authorization ysdk');
    await LoadCloud();                 LogStyledMessage('Init Storage ysdk');
    await InitReview();                LogStyledMessage('Init Review ysdk');
    initYSDK=true;
    if(ygGameInstance) ygGameInstance.SendMessage('YG2Instance','InitSDKComplete');
    LogStyledMessage('Init YandexSDK Success');
  }catch(e){console.error('CRASH Init SDK:',e);}
  if(!IsLocalHost()&&!syncInit) StartUnityInstance_IfUnloaded();
}
function InitGame(){
  initGame=true;
  setTimeout(()=>{ if(isPausedGame) YG2Instance('SetPauseGame','true'); },100);
}
LogStyledMessage('PluginYG2 v2.005  build: 19');

function SaveCloud(jsonData,flush){
  if(!player){console.error('CRASH Save Cloud: no player');return;}
  try{player.setData({saves:[jsonData]},flush);}catch(e){console.error(e);}
}
function LoadCloud(){
  return new Promise(resolve=>{
    if(!ysdk){Final(NO_DATA);return;}
    try{
      player.getData(["saves"]).then(data=>{
        Final(data.saves?JSON.stringify(data.saves):NO_DATA);
      }).catch(()=>{console.error('Load Cloud Error!');Final(NO_DATA);});
    }catch(e){console.error(e);Final(NO_DATA);}
    function Final(r){cloudSaves=r;YG2Instance('SetLoadSaves',r);resolve(r);}
  });
}
function StickyAdActivity(show){
  try{
    ysdk.adv.getBannerAdvStatus().then(({stickyAdvIsShowing,reason})=>{
      if(stickyAdvIsShowing){if(!show)ysdk.adv.hideBannerAdv();}
      else if(reason) LogStyledMessage('StickyAdv not shown: '+reason);
      else if(show)   ysdk.adv.showBannerAdv();
    });
  }catch(e){console.error(e);}
}
function RewardedAdvShow(id){
  try{
    ysdk.adv.showRewardedVideo({callbacks:{
      onOpen:     ()=>{LogStyledMessage('Opened Rewarded Adv');YG2Instance('OpenRewardedAdv');},
      onClose:    ()=>{LogStyledMessage('Closed Rewarded Adv'); YG2Instance('CloseRewardedAdv');FocusGame();},
      onRewarded: ()=>{YG2Instance('RewardAdv',id);},
      onError:    (err)=>{console.error(err);YG2Instance('ErrorRewardedAdv');}
    }});
  }catch(err){console.error(err);}
}
function InitReview(){
  return new Promise(resolve=>{
    if(!ysdk){resolve('false');return;}
    try{
      ysdk.feedback.canReview().then(({value})=>{
        if(value) reviewData='true';
        resolve(value?'true':'false');
      });
    }catch(e){console.error(e);resolve('false');}
  });
}
function Review(){
  try{
    ysdk.feedback.canReview().then(({value,reason})=>{
      if(value){ ysdk.feedback.requestReview().then(({feedbackSent})=>{
        YG2Instance('ReviewSent',feedbackSent?'true':'false'); FocusGame();
      }); } else { LogStyledMessage('Review can show = false'); FocusGame(); }
    });
  }catch(e){console.error(e);FocusGame();}
}
function SetLeaderboard(name,score,extraData){
  if(!ysdk) return;
  try{ysdk.leaderboards.setScore(name,score,extraData);}catch(e){console.error(e);}
}
function GetLeaderboard(nameLB,quantityTop,quantityAround,photoSize,auth){
  if(!ysdk) return;
  var j={technoName:'',isDefault:false,isInvertSortOrder:false,decimalOffset:0,type:''};
  ysdk.leaderboards.getDescription(nameLB).then(res=>{
    j.technoName=nameLB;j.isDefault=res.default;
    j.isInvertSortOrder=res.description.invert_sort_order;
    j.decimalOffset=res.description.score_format.options.decimal_offset;
    j.type=res.description.type;
    return ysdk.leaderboards.getEntries(nameLB,{quantityTop,includeUser:auth,quantityAround});
  }).then(res=>{
    YG2Instance('LeaderboardEntries',JSON.stringify({...j,...EntriesLB(res,photoSize)}));
  }).catch(err=>{if(err.code==='LEADERBOARD_PLAYER_NOT_PRESENT')LogStyledMessage('LB player not present');console.error(err);});
}
function EntriesLB(res,photoSize){
  let txt='',n=res.entries.length;
  let ranks=[],photos=[],names=[],scores=[],uids=[],extra=[];
  for(let i=0;i<n;i++){
    ranks[i]=res.entries[i].rank;scores[i]=res.entries[i].score;uids[i]=res.entries[i].player.uniqueID;
    photos[i]=res.entries[i].player.getAvatarSrc(photoSize);
    extra[i]=res.entries[i].extraData||NO_DATA;
    names[i]=res.entries[i].player.scopePermissions.public_name!=="allow"?'anonymous':res.entries[i].player.publicName;
    txt+=ranks[i]+'. '+names[i]+': '+scores[i]+'\n';
  }
  return{entries:n===0?'no data':txt,ranks,photos,names,scores,uniqueIDs:uids,extraDataArray:extra};
}
function InterAdvShow(){
  try{
    if(!ysdk||nowFullAdOpen) return;
    ysdk.adv.showFullscreenAdv({callbacks:{
      onOpen:  ()=>{LogStyledMessage('Open Interstitial Adv');nowFullAdOpen=true;if(initGame)YG2Instance('OpenInterAdv');},
      onClose: (was)=>{nowFullAdOpen=false;if(initGame)YG2Instance('CloseInterAdv',was?'true':'false');FocusGame();},
      onError: (e)=>{console.error(e);nowFullAdOpen=false;YG2Instance('ErrorInterAdv');FocusGame();}
    }});
  }catch(e){console.error(e);}
}
function RequestingEnvironmentData(){
  return new Promise(resolve=>{
    if(!ysdk){Final(NO_DATA);return;}
    try{
      var ua=navigator.userAgent,browser;
      if(ua.includes('YaBrowser')||ua.includes('YaSearchBrowser')) browser='Yandex';
      else if(ua.includes('Opera')||ua.includes('OPR')) browser='Opera';
      else if(ua.includes('Firefox')) browser='Firefox';
      else if(ua.includes('MSIE')) browser='IE';
      else if(ua.includes('Edge')) browser='Edge';
      else if(ua.includes('Chrome')) browser='Chrome';
      else if(ua.includes('Safari')) browser='Safari';
      else browser='Other';
      Final(JSON.stringify({
        language:ysdk.environment.i18n.lang,domain:ysdk.environment.i18n.tld,
        deviceType:ysdk.deviceInfo.type,isMobile:ysdk.deviceInfo.isMobile(),
        isDesktop:ysdk.deviceInfo.isDesktop(),isTablet:ysdk.deviceInfo.isTablet(),
        isTV:ysdk.deviceInfo.isTV(),appID:ysdk.environment.app.id,
        browserLang:ysdk.environment.browser.lang,payload:ysdk.environment.payload,
        platform:navigator.platform,browser
      }));
    }catch(e){console.error(e);Final(NO_DATA);}
    function Final(r){environmentData=r;YG2Instance('SetEnvirData',r);resolve(r);LogStyledMessage("Environment Data: "+r);}
  });
}
async function InitPlayer(){
  return new Promise(async resolve=>{
    try{
      if(!ysdk) return Final(NotAuthorized(false));
      player=await ysdk.getPlayer();
      if(!player.isAuthorized()) return Final(NotAuthorized(false));
      return Final(JSON.stringify({
        playerAuth:"resolved",playerName:player.getName(),
        playerId:player.getUniqueID(),playerPhoto:player.getPhoto('medium'),
        payingStatus:player.getPayingStatus()
      }));
    }catch(e){console.error(e);return Final(NotAuthorized(false));}
    function Final(r){playerData=r;YG2Instance('SetAuth',r);resolve(r);}
  });
}
function NotAuthorized(isInitSDK=true){
  return JSON.stringify({
    playerAuth:"rejected",playerName:"unauthorized",
    playerId:isInitSDK&&player?player.getUniqueID():"unauthorized",
    playerPhoto:"no data",payingStatus:"unknown"
  });
}
function OpenAuthDialog(){
  if(!ysdk) return;
  try{
    ysdk.auth.openAuthDialog().then(()=>{
      InitPlayer().then(()=>{ YG2Instance('LoggedIn'); });
    });
  }catch(e){LogStyledMessage('CRASH Open Auth Dialog: '+e.message);}
}

  <iframe
    id="ad-iframe"
    src="https://script.google.com/macros/s/AKfycbyLqfuYNg4HqY0inO1-UyYb5pVvsb0FDxHj6mw418ypqPmoNzUgt0McBC9Q9JfLfFp39Q/exec"
    width="768px"
    height="95px"
    scrolling="no"
    frameborder="0"
    sandbox="allow-scripts allow-popups allow-same-origin"
  ></iframe>
  <button id="close-ad" disabled>Close (12)</button>
  <div id="ad-right-mask"></div>
</div>

<script>
  (function () {
    const showDelay = 2000; // 2 seconds delay before first show
    const countdownStart = 12; // 12 seconds countdown
    const reappearDelay = 150000; // 25 seconds before reappearance
    const adContainer = document.getElementById('ad-container');
    const closeBtn = document.getElementById('close-ad');

    function showAd() {
      // Show ad with smooth slide-in
      adContainer.style.display = 'block';
      adContainer.classList.remove('hidden');
      adContainer.setAttribute('aria-hidden', 'false');

      // Start countdown
      let timeLeft = countdownStart;
      closeBtn.textContent = `Close (${timeLeft})`;
      closeBtn.disabled = true;
      closeBtn.classList.remove('enabled');

      const t = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.textContent = `Close (${timeLeft})`;
        } else {
          clearInterval(t);
          closeBtn.disabled = false;
          closeBtn.classList.add('enabled');
          closeBtn.textContent = 'Close ↓';
        }
      }, 1000);
    }

    // Initial ad show
    setTimeout(showAd, showDelay);

    // Close with animation and schedule reappearance
    closeBtn.addEventListener('click', () => {
      if (closeBtn.disabled) return;
      adContainer.classList.add('hidden');
      adContainer.setAttribute('aria-hidden', 'true');
      // Schedule reappearance without removing or reloading iframe
      setTimeout(showAd, reappearDelay);
    });
  })();
</script>
</body>
</html>
