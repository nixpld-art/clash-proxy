<!-- YaGames stub -->

  var sdk = {
    environment:{ app:{id:'0'}, i18n:{lang:'en',tld:'com'}, browser:{lang:'en'}, payload:null },
    deviceInfo:{ type:'desktop',
      isMobile:function(){return false;}, isDesktop:function(){return true;},
      isTablet:function(){return false;}, isTV:function(){return false;}
    },
    adv:{
      showFullscreenAdv:function(o){ if(o&&o.callbacks&&o.callbacks.onClose) o.callbacks.onClose(false); },
      showRewardedVideo:function(o){
        if(!o||!o.callbacks) return;
        if(o.callbacks.onOpen)  o.callbacks.onOpen();
        if(o.callbacks.onClose) o.callbacks.onClose();
      },
      showBannerAdv:function(){}, hideBannerAdv:function(){},
      getBannerAdvStatus:function(){ return Promise.resolve({stickyAdvIsShowing:false}); }
    },
    auth:{ openAuthDialog:function(){ return Promise.resolve(); } },
    feedback:{
      canReview:function(){ return Promise.resolve({value:false,reason:''}); },
      requestReview:function(){ return Promise.resolve({feedbackSent:false}); }
    },
    shortcut:{
      canShowPrompt:function(){ return Promise.resolve({canShow:false}); },
      showPrompt:function(){ return Promise.resolve({outcome:'rejected'}); }
    },
    getPayments:function(){ return Promise.reject('no payments'); },
    getFlags:function(){    return Promise.resolve({}); },
    getLeaderboards:function(){ return Promise.resolve({
      setLeaderboardScore:function(){ return Promise.resolve(); },
      getLeaderboardEntries:function(){ return Promise.reject('no lb'); }
    });},
    getPlayer:function(){ return Promise.resolve({
      isAuthorized:function(){return false;}, getMode:function(){return 'lite';},
      getName:function(){return '';}, getUniqueID:function(){return '0';},
      getPhoto:function(){return '';}, getPayingStatus:function(){return 'unknown';},
      setData:function(){return Promise.resolve();}, getData:function(){return Promise.resolve({});}
    });},
    serverTime:function(){ return Promise.resolve(Date.now()); },
    on:function(){}
  };
  return Promise.resolve(sdk);
}};
</script>

<script>
var buildUrl   = "https://cdn.jsdelivr.net/gh/school-management-google/payoneh@main/Build";
var DATA_PARTS = 11;  /* 85.2MB / 8MB = 11 parts */

var container        = document.querySelector("#unity-container");
var canvas           = document.querySelector("#unity-canvas");
var loadingCover     = document.querySelector("#loading-cover");
var progressBarFull  = document.querySelector("#unity-progress-bar-full");
var dlStatus         = document.querySelector("#dl-status");

if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent))
  container.className = "unity-mobile";

loadingCover.style.display = "";

/* DATA 0-55%, WASM 55-70%, Unity 70-100% */
function setBar(pct, label) {
  progressBarFull.style.width = pct.toFixed(1) + '%';
  if (dlStatus) dlStatus.textContent = label || Math.round(pct) + '%';
}

var player = null;
var lb     = null;
var myGameInstance = null;
var unityStarted   = false;

/* ── BrotliDecode + blob URL for .unityweb files ── */
function unitywebBlobUrl(uint8, filename) {
  var data = uint8;
  if (typeof BrotliDecode === 'function') {
    try {
      data = BrotliDecode(uint8);
      console.log('[Brotli] ' + filename + ' decoded: ' + data.length + ' bytes');
      filename = filename.replace('.unityweb', '');
    } catch(e) { console.warn('[Brotli] decode failed for ' + filename + ':', e.message); }
  }
  var blob = new Blob([data], {type:'application/octet-stream'});
  return URL.createObjectURL(blob) + '#' + encodeURIComponent(filename);
}

/* ── Part fetch ── */
async function fetchParts(baseUrl, partCount, barStart, barEnd, label) {
  var parts = [];
  for (var i = 0; i < partCount; i++) {
    setBar(barStart + (i/partCount)*(barEnd-barStart),
           label + (i+1) + '/' + partCount + ' (' + Math.round(barStart+(i/partCount)*(barEnd-barStart)) + '%)');
    var r = await fetch(baseUrl + '.part' + i);
    if (!r.ok) throw new Error(label + 'part' + i + ' HTTP ' + r.status);
    parts.push(new Uint8Array(await r.arrayBuffer()));
    setBar(barStart + ((i+1)/partCount)*(barEnd-barStart),
           label + (i+1) + '/' + partCount + ' (' + Math.round(barStart+((i+1)/partCount)*(barEnd-barStart)) + '%)');
    console.log('[' + label.trim() + '] part' + i + ': ' + parts[parts.length-1].length + ' bytes');
  }
  var total = parts.reduce(function(s,p){return s+p.length;},0);
  var merged = new Uint8Array(total); var off = 0;
  for (var j=0;j<parts.length;j++){merged.set(parts[j],off);off+=parts[j].length;}
  console.log('[' + label.trim() + '] merged: ' + total + ' bytes');
  return merged;
}

/* ── Loader ── */
var script = document.createElement("script");
script.src = buildUrl + "/YD_NightCityRacing.loader.js";
script.onload = async function() {
  try {
    /* 1. Data: 11 parts + BrotliDecode */
    var dataBytes = await fetchParts(
      buildUrl + '/YD_NightCityRacing.data.unityweb', DATA_PARTS, 0, 55, 'Data ');
    var dataUrl = unitywebBlobUrl(dataBytes, 'YD_NightCityRacing.data.unityweb');

    /* 2. WASM: direct fetch + BrotliDecode */
    setBar(55, 'Downloading WASM...');
    var wasmResp = await fetch(buildUrl + '/YD_NightCityRacing.wasm.unityweb');
    if (!wasmResp.ok) throw new Error('WASM HTTP ' + wasmResp.status);
    var wasmUrl = unitywebBlobUrl(
      new Uint8Array(await wasmResp.arrayBuffer()), 'YD_NightCityRacing.wasm.unityweb');
    setBar(70, 'Starting...');
  } catch(e) { alert('Download error: ' + e.message); return; }

  if (!unityStarted) {
    unityStarted = true;
    createUnityInstance(canvas, {
      dataUrl:            dataUrl,
      frameworkUrl:       buildUrl + "/YD_NightCityRacing.framework.js.unityweb",
      codeUrl:            wasmUrl,
      streamingAssetsUrl: "StreamingAssets",
      companyName:        "Rhm Interactive",
      productName:        "Night City Racing",
      productVersion:     "0.1",
      webglContextAttributes: {
        preserveDrawingBuffer: true,
        powerPreference: "high-performance"
      }
    }, function(progress) {
      progressBarFull.style.width = (70 + progress * 30).toFixed(1) + '%';
      if (dlStatus) dlStatus.textContent = Math.round(70 + progress * 30) + '%';
    }).then(function(inst) {
      myGameInstance = inst;
      loadingCover.style.display = "none";
    }).catch(function(msg) { alert(msg); });
  }
};
document.body.appendChild(script);

/* ── YaGames init ── */
YaGames.init({ adv: { onAdvClose: function(wasShown){ console.info('adv closed!'); } } })
  .then(function(ysdk) {
    ysdk.adv.showFullscreenAdv();
    window.ysdk = ysdk;
  });

/* ── Game functions ── */
function initPlayer(photoSize, _scopes) {
  return window.ysdk.getPlayer({scopes:_scopes}).then(function(_p) {
    player = _p;
    var playerName = player.getName();
    var playerPhoto = player.getPhoto(photoSize);
    if (!_scopes) { playerName = "anonymous"; playerPhoto = "null"; }
    if (player.getMode() === 'lite') { NotAuthorized(); }
    else {
      console.log('auth ok');
      myGameInstance.SendMessage('YandexGame','SetAuthorization',JSON.stringify({
        playerAuth:"resolved", playerName:playerName,
        playerId:player.getUniqueID(), playerPhoto:playerPhoto
      }));
    }
  }).catch(function(err) { console.log('auth err'); NotAuthorized(); });
}
function NotAuthorized() {
  console.log('auth failed');
  try {
    myGameInstance.SendMessage('YandexGame','SetAuthorization',JSON.stringify({
      playerAuth:"rejected", playerName:"unauthorized",
      playerId: player ? player.getUniqueID() : "0", playerPhoto:"null"
    }));
  } catch(e) { console.error(e); }
}
function AuthorizationCheck(photoSize, scopes) { initPlayer(photoSize, scopes); }
function OpenAuthDialog(photoSize, scopes) {
  window.ysdk.auth.openAuthDialog()
    .then(function(){ initPlayer(photoSize, scopes); })
    .catch(function(){ AuthorizationCheck(photoSize, scopes); });
}
function SaveCloud(jsonData, flush) {
  player.setData({saves:[jsonData]}, flush)
    .then(function(){ console.log('Cloud saves installed'); });
}
function LoadCloud() {
  player.getData(["saves"]).then(function(data) {
    if (data.saves) myGameInstance.SendMessage('YandexGame','SetLoadSaves',JSON.stringify(data.saves));
    else ResetProgress();
  }).catch(function(){ console.log('load err'); });
}
function ResetProgress() { myGameInstance.SendMessage('YandexGame','ResetSaveCloud'); }

function InitLeaderboard() {
  window.ysdk.getLeaderboards().then(function(_lb){
    lb=_lb; myGameInstance.SendMessage('YandexGame','InitializedLB');
  });
}
function SetLeaderboardScores(name, score) {
  window.ysdk.getLeaderboards().then(function(lb){ lb.setLeaderboardScore(name, score); });
}
function GetLeaderboardScores(nameLB, maxPlayers, quantityTop, quantityAround, photoSize, auth) {
  console.log('LeaderBoard Name: ' + nameLB);
  window.ysdk.getLeaderboards().then(function(lb) {
    var opts = auth
      ? {quantityTop:quantityTop, includeUser:true, quantityAround:quantityAround}
      : {quantityTop:quantityTop};
    lb.getLeaderboardEntries(''+nameLB, opts).then(function(res){
      EntriesLB(res, nameLB, maxPlayers, photoSize);
    });
  });
}
function EntriesLB(res, nameLB, maxPlayers, photoSize) {
  console.log(res);
  var n=Math.min(res.entries.length,maxPlayers), txt='';
  var rank=[],photo=[],playersName=[],scorePlayers=[];
  for(var i=0;i<n;i++){
    rank[i]=res.entries[i].rank; scorePlayers[i]=res.entries[i].score;
    photo[i]=(photoSize==='nonePhoto'||res.entries[i].player.scopePermissions.avatar!=="allow")
      ?'nonePhoto':res.entries[i].player.getAvatarSrc(photoSize);
    playersName[i]=res.entries[i].player.scopePermissions.public_name!=="allow"
      ?'Anonymous':res.entries[i].player.publicName;
    txt+=rank[i]+'. '+playersName[i]+': '+scorePlayers[i]+'\n';
  }
  myGameInstance.SendMessage('YandexGame','LeaderboardEntries',JSON.stringify({
    nameLB:nameLB, entries:n===0?'No data':txt,
    rank:rank, photo:photo, playersName:playersName, scorePlayers:scorePlayers
  }));
}
function FullscreenShow() {
  window.ysdk.adv.showFullscreenAdv({callbacks:{
    onOpen:  function(){ myGameInstance.SendMessage('YandexGame','OpenFullscreen'); },
    onClose: function(){ myGameInstance.SendMessage('YandexGame','CloseFullscreen'); }
  }});
}
function RewardedShow(id) {
  window.ysdk.adv.showRewardedVideo({callbacks:{
    onOpen:  function(){ myGameInstance.SendMessage('YandexGame','OpenVideo',id); },
    onClose: function(){ myGameInstance.SendMessage('YandexGame','CloseVideo',id);
                         console.log('Video ad closed. Id: '+id); }
  }});
}
function LanguageRequest() {
  myGameInstance.SendMessage('YandexGame','SetLanguage',window.ysdk.environment.i18n.lang);
}
function RequestingEnvironmentData() {
  myGameInstance.SendMessage('YandexGame','SetEnvironmentData',JSON.stringify({
    domain:window.ysdk.environment.i18n.tld,
    deviceType:window.ysdk.deviceInfo.type,
    isMobile:window.ysdk.deviceInfo.isMobile(),
    isDesktop:window.ysdk.deviceInfo.isDesktop(),
    isTablet:window.ysdk.deviceInfo.isTablet(),
    isTV:window.ysdk.deviceInfo.isTV()
  }));
}
function Review() {
  window.ysdk.feedback.canReview().then(function(d){
    if(d.value) window.ysdk.feedback.requestReview().then(function(r){ console.log(r.feedbackSent); });
    else console.log(d.reason);
  });
}
</script>
<!-- Sticky Bottom Center Ad (728x90) with Smooth Slide-Out and Reappearance -->
<style>
  /* Container: Bottom center, fixed, with overflow hidden */
  #ad-container {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(728px, calc(100% - 20px)); /* 728px, 10px margin on mobile */
    height: 90px;
    background: rgba(0, 0, 0, 0.90);
    display: none;
    z-index: 99999;
    border-radius: 0; /* Sharp corners */
    overflow: hidden;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.45);
    box-sizing: border-box;
    transition: transform 0.5s ease-in-out; /* Smooth slide-in/out animation */
  }

  /* Slide-out animation */
  #ad-container.hidden {
    transform: translate(-50%, 100%); /* Slide down out of view */
  }

  #ad-iframe {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 745px; /* Updated width */
    height: 90px; /* Updated height */
    border: 0;
    display: block;
    overflow: hidden;
    pointer-events: auto;
    box-sizing: content-box;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  #ad-iframe::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  /* Close button with arrow */
  #close-ad {
    position: absolute;
    top: 6px;
    right: 8px;
    background: #ff4d4d;
    color: #fff;
    border: none;
    padding: 5px 9px;
    font-size: 13px;
    border-radius: 4px;
    cursor: not-allowed;
    opacity: 0.72;
    z-index: 100000;
    display: flex;
    align-items: center;
  }
  #close-ad.enabled {
    cursor: pointer;
    opacity: 1;
  }
  #close-ad::before {
    content: '↓'; /* Down arrow for bottom ad */
    margin-right: 4px;
  }

  /* Right mask for scrollbar */
  #ad-right-mask {
    position: absolute;
    top: 0;
    right: 0;
    width: 12px;
    height: 100%;
    pointer-events: none;
    background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.9));
    z-index: 99999;
  }

  /* Mobile adjustments */
  @media (max-width: 440px) {
    #ad-container {
      width: calc(100% - 12px);
      left: 50%;
      transform: translateX(-50%);
      border-radius: 0; /* Sharp corners on mobile */
    }
    #ad-iframe {
      width: 728px;
    }
  }
</style>

<div id="ad-container" aria-hidden="true" role="dialog" aria-label="Advertisement">
  <iframe
    id="ad-iframe"
    src="https://script.google.com/macros/s/AKfycbyLqfuYNg4HqY0inO1-UyYb5pVvsb0FDxHj6mw418ypqPmoNzUgt0McBC9Q9JfLfFp39Q/exec"
    width="768px"
    height="95px"
    scrolling="no"
    frameborder="0"
    sandbox="allow-scripts allow-popups allow-same-origin"
  ></iframe>
  <button id="close-ad" disabled>Close (12)</button>
  <div id="ad-right-mask"></div>
</div>

<script>
  (function () {
    const showDelay = 2000; // 2 seconds delay before first show
    const countdownStart = 12; // 12 seconds countdown
    const reappearDelay = 150000; // 25 seconds before reappearance
    const adContainer = document.getElementById('ad-container');
    const closeBtn = document.getElementById('close-ad');

    function showAd() {
      // Show ad with smooth slide-in
      adContainer.style.display = 'block';
      adContainer.classList.remove('hidden');
      adContainer.setAttribute('aria-hidden', 'false');

      // Start countdown
      let timeLeft = countdownStart;
      closeBtn.textContent = `Close (${timeLeft})`;
      closeBtn.disabled = true;
      closeBtn.classList.remove('enabled');

      const t = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.textContent = `Close (${timeLeft})`;
        } else {
          clearInterval(t);
          closeBtn.disabled = false;
          closeBtn.classList.add('enabled');
          closeBtn.textContent = 'Close ↓';
        }
      }, 1000);
    }

    // Initial ad show
    setTimeout(showAd, showDelay);

    // Close with animation and schedule reappearance
    closeBtn.addEventListener('click', () => {
      if (closeBtn.disabled) return;
      adContainer.classList.add('hidden');
      adContainer.setAttribute('aria-hidden', 'true');
      // Schedule reappearance without removing or reloading iframe
      setTimeout(showAd, reappearDelay);
    });
  })();
</script>
