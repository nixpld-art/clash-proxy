function createLocalSDK(){
  var LS="gs_player_data", LSA="gs_player_achievements", LSP="gs_player_purchases";
  function readJSON(k,f){ try{ return JSON.parse(localStorage.getItem(k)||f); }catch(e){ return JSON.parse(f); } }
  function writeJSON(k,o){ try{ localStorage.setItem(k,JSON.stringify(o)); }catch(e){} }

  var data=readJSON(LS,"{}"), achDone=readJSON(LSA,"[]"), owned=readJSON(LSP,"[]");
  var fieldMap={};
  (FIELDS||[]).forEach(function(f){
    if(!f||!f.key) return;
    var d={ key:f.key, name:f.name||f.key, type:f.type||"data",
            "default":(f["default"]!==undefined?f["default"]:""),
            important:!!f.important, "public":!!f["public"], variants:f.variants||[] };
    fieldMap[f.key]=d;
    if(!Object.prototype.hasOwnProperty.call(data,f.key) && d["default"]!==undefined && d["default"]!==null)
      data[f.key]=d["default"];
  });
  Object.keys(FIELD_DEFAULTS||{}).forEach(function(k){
    if(!Object.prototype.hasOwnProperty.call(data,k)) data[k]=FIELD_DEFAULTS[k];
  });
  function fieldList(){ return Object.keys(fieldMap).map(function(k){ return fieldMap[k]; }); }
  function regField(k,v){
    if(!k || fieldMap[k]) return;
    fieldMap[k]={ key:k, name:k, type:(typeof v==="number"?"stats":"data"),
                  "default":(typeof v==="number"?0:""), important:false, "public":false, variants:[] };
  }

  function Bus(){
    var m={};
    return {
      on:function(n,f){ (m[n]=m[n]||[]).push(f); return function(){}; },
      once:function(n,f){ var s=this,w=function(){ s.off(n,w); f.apply(null,arguments); }; return s.on(n,w); },
      off:function(n,f){ if(m[n]) m[n]=m[n].filter(function(x){return x!==f}); },
      emit:function(n){ var a=[].slice.call(arguments,1);
        (m[n]||[]).forEach(function(f){ try{ f.apply(null,a); }catch(e){} }); }
    };
  }
  var bAds=Bus(), bPlayer=Bus(), bLb=Bus(), bAch=Bus(), bGc=Bus(), bFs=Bus(), bSoc=Bus(), bRoot=Bus();
  function later(fn,ms){ setTimeout(fn, ms||0); }
  var isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  var AD_MS=400;
  var ads={
    on:bAds.on, once:bAds.once, off:bAds.off,
    isAdblockEnabled:false,
    isFullscreenAvailable:true, isRewardedAvailable:true,
    isPreloaderAvailable:true,  isStickyAvailable:false,
    isFullscreenPlaying:false, isRewardedPlaying:false,
    isPreloaderPlaying:false,  isStickyPlaying:false,
    showFullscreen:function(){
      var s=this;
      return new Promise(function(r){
        s.isFullscreenPlaying=true; bAds.emit("start"); bAds.emit("fullscreen:start");
        later(function(){ s.isFullscreenPlaying=false;
          bAds.emit("fullscreen:close",false); bAds.emit("close",false);
          try{window.focus()}catch(e){} r(false); },AD_MS);

    },
    showPreloader:function(){
      var s=this;
      return new Promise(function(r){
        s.isPreloaderPlaying=true; bAds.emit("start"); bAds.emit("preloader:start");
        later(function(){ s.isPreloaderPlaying=false;
          bAds.emit("preloader:close",false); bAds.emit("close",false);
          try{window.focus()}catch(e){} r(false); },AD_MS);
      });
    },
    showRewardedVideo:function(){
      var s=this;
      return new Promise(function(r){
        s.isRewardedPlaying=true; bAds.emit("start"); bAds.emit("rewarded:start");
        later(function(){
          bAds.emit("rewarded:reward");
          later(function(){ s.isRewardedPlaying=false;
            bAds.emit("rewarded:close",true); bAds.emit("close",true);
            try{window.focus()}catch(e){} r(true); },120);
        },AD_MS);
      });
    },
    showSticky:function(){ return Promise.resolve(false); },
    closeSticky:function(){ return Promise.resolve(false); },
    refreshSticky:function(){ return Promise.resolve(false); }
  };

  var player={
    on:bPlayer.on, once:bPlayer.once, off:bPlayer.off,
    ready:Promise.resolve(true),
    isLoggedIn:false, isStub:true, hasAnyCredentials:false,
    id:1, score:0, name:"Player", avatar:"",
    get fields(){ return fieldList(); },
    get:function(k){
      if(Object.prototype.hasOwnProperty.call(data,k)){
        var v=data[k]; return (v===undefined||v===null) ? "" : v;
      }
      if(fieldMap[k] && fieldMap[k]["default"]!==undefined && fieldMap[k]["default"]!==null)
        return fieldMap[k]["default"];
      if(Object.prototype.hasOwnProperty.call(FIELD_DEFAULTS,k)) return FIELD_DEFAULTS[k];
      return "";
    },
    set:function(k,v){
      if(k&&typeof k==="object"){ Object.keys(k).forEach(function(x){ regField(x,k[x]); }); Object.assign(data,k); }
      else { regField(k,v); data[k]=v; }
      writeJSON(LS,data); bPlayer.emit("change"); return this;
    },
    add:function(k,v){ regField(k,0); data[k]=(+data[k]||0)+(+v||0); writeJSON(LS,data); bPlayer.emit("change"); return this; },
    toggle:function(k){ regField(k,false); data[k]=!data[k]; writeJSON(LS,data); bPlayer.emit("change"); return this; },
    has:function(k){ return Object.prototype.hasOwnProperty.call(data,k); },
    reset:function(){ data={}; (FIELDS||[]).forEach(function(f){ if(f&&f.key&&f["default"]!==undefined) data[f.key]=f["default"]; });
                      writeJSON(LS,data); bPlayer.emit("change"); return this; },
    remove:function(){ data={}; writeJSON(LS,data); bPlayer.emit("change"); return this; },
    getField:function(k){ return fieldMap[k] || { key:k, name:String(k==null?"":k), type:"data", "default":"", variants:[] }; },
    getFieldName:function(k){ var f=fieldMap[k]; return String(f&&f.name!=null?f.name:(k==null?"":k)); },
    getFieldVariantName:function(k,v){
      var f=fieldMap[k];
      if(f&&f.variants) for(var i=0;i<f.variants.length;i++)
        if(f.variants[i] && f.variants[i].value===v) return String(f.variants[i].name!=null?f.variants[i].name:v);
      return String(v==null?"":v);
    },
    toJSON:function(){ return JSON.parse(JSON.stringify(data)); },
    sync:function(){ writeJSON(LS,data); later(function(){ bPlayer.emit("sync",true); }); return Promise.resolve(true); },
    load:function(){ data=readJSON(LS,"{}"); later(function(){ bPlayer.emit("load",true); }); return Promise.resolve(true); },
    login:function(){ later(function(){ bPlayer.emit("login",false); }); return Promise.resolve(false); },
    fetchFields:function(){ var l=fieldList(); later(function(){ bPlayer.emit("fetchFields",true); }); return Promise.resolve(l); }

  function me(){ return { id:player.id, name:player.name, avatar:"", score:player.score, position:1 }; }
  function lbList(){ return Promise.resolve({ players:[ me() ] }); }
  function lbRating(){ return Promise.resolve({ player:{ position:1 }, players:[ me() ] }); }
  var leaderboard={
    on:bLb.on, once:bLb.once, off:bLb.off,
    open:function(){ bLb.emit("open"); return Promise.resolve(true); },
    close:function(){ return Promise.resolve(true); },
    fetch:lbList,
    fetchPlayerRating:lbRating,
    openScoped:function(){ bLb.emit("open"); return Promise.resolve(true); },
    fetchScoped:lbList,
    fetchPlayerRatingScoped:lbRating,
    publishRecord:function(){ return Promise.resolve(true); }
  };

  function achList(){
    return (ACHIEVEMENTS||[]).map(function(a){
      var o=JSON.parse(JSON.stringify(a));
      o.unlocked = achDone.indexOf(o.tag)>=0 || achDone.indexOf(o.id)>=0;
      return o;
    });
  }
  function playerAch(){
    return achList().filter(function(a){ return a.unlocked; })
      .map(function(a){ return { id:a.id, achievementId:a.id, tag:a.tag, progress:a.maxProgress||0, unlocked:true }; });
  }
  var achievements={
    on:bAch.on, once:bAch.once, off:bAch.off,
    open:function(){ bAch.emit("open"); return Promise.resolve(true); },
    close:function(){ bAch.emit("close"); return Promise.resolve(true); },
    unlock:function(o){
      var key=(o&&(o.tag!=null?o.tag:o.id));
      if(key!=null && achDone.indexOf(key)<0){ achDone.push(key); writeJSON(LSA,achDone); }
      later(function(){ bAch.emit("unlock",o); });
      return Promise.resolve({success:true});
    },
    fetch:function(){ return Promise.resolve({
      achievements: achList(),
      achievementsGroups: JSON.parse(JSON.stringify(ACH_GROUPS||[])),
      playerAchievements: playerAch()
    }); }
  };

  var gamesCollections={
    on:bGc.on, once:bGc.once, off:bGc.off,
    open:function(){ bGc.emit("open"); return Promise.resolve(true); },
    close:function(){ bGc.emit("close"); return Promise.resolve(true); },
    fetch:function(){ return Promise.resolve({ id:0, tag:"", name:"", description:"", games:[] }); }
  };

  var fullscreen={
    on:bFs.on, once:bFs.once, off:bFs.off,
    get isEnabled(){ return !!document.fullscreenElement; },
    open:function(){ try{ (document.documentElement.requestFullscreen||function(){})
        .call(document.documentElement); }catch(e){} return Promise.resolve(true); },
    close:function(){ try{ if(document.exitFullscreen) document.exitFullscreen(); }catch(e){}
        return Promise.resolve(true); },
    toggle:function(){ return document.fullscreenElement ? this.close() : this.open(); }
  };
  document.addEventListener("fullscreenchange",function(){
    bFs.emit("change", !!document.fullscreenElement);
    bFs.emit(document.fullscreenElement ? "open" : "close");
  });

  var socials={
    on:bSoc.on, once:bSoc.once, off:bSoc.off,
    communityLink:"", canJoinCommunity:false,
    isSupportsNativeShare:false, isSupportsNativePosts:false,
    isSupportsNativeInvite:false, isSupportsNativeCommunityJoin:false,
    share:function(){ bSoc.emit("share",false); return Promise.resolve(false); },
    post:function(){ bSoc.emit("post",false); return Promise.resolve(false); },
    invite:function(){ bSoc.emit("invite",false); return Promise.resolve(false); },
    joinCommunity:function(){ bSoc.emit("joinCommunity",false); return Promise.resolve(false); }
  };

  function findProduct(o){
    var id=(o&&o.id), tag=(o&&o.tag), l=(PRODUCTS||[]);
    for(var i=0;i<l.length;i++){ if((id&&l[i].id==id)||(tag&&l[i].tag===tag)) return l[i]; }
    return null;
  }
  function ownedList(){
    return owned.map(function(t){
      var p=findProduct({tag:t})||findProduct({id:t});
      return p ? { id:p.id, tag:p.tag, productId:p.id, price:p.price, name:p.name } : { id:0, tag:String(t) };
    });
  }
  var payments={
    isAvailable: !!FREE_STORE,
    fetchProducts:function(){ return Promise.resolve({
      products: JSON.parse(JSON.stringify(PRODUCTS||[])),
      playerPurchases: ownedList()
    }); },
    purchase:function(o){
      if(!FREE_STORE) return Promise.resolve({ success:false });
      var p=findProduct(o), key=(p?p.tag:(o&&(o.tag!=null?o.tag:o.id)));
      if(key!=null && owned.indexOf(key)<0){ owned.push(key); writeJSON(LSP,owned); }
      return Promise.resolve({ success:true, purchase:{ id:(p?p.id:0), tag:String(key==null?"":key) }, product:p||null });
    },
    consume:function(o){
      var p=findProduct(o), key=(p?p.tag:(o&&(o.tag!=null?o.tag:o.id)));
      var i=owned.indexOf(key); if(i>=0){ owned.splice(i,1); writeJSON(LSP,owned); }
      return Promise.resolve({ success:true });
    }
  };
  var analytics={ hit:function(){}, goal:function(){} };

  var paused=false;
  var api={
    isDev:false, isAllowedOrigin:true, isMobile:isMobile,
    language:LANG, avatarGenerator:"adventurer",
    get serverTime(){ return Math.floor(Date.now()/1000); },
    get isPaused(){ return paused; },
    app:{ title:document.title||"Game", description:"", image:"", url:location.href },
    platform:{ type:"custom", hasIntegratedAuth:false, isExternalLinksAllowed:true },
    ads:ads, player:player, leaderboard:leaderboard, achievements:achievements,
    gamesCollections:gamesCollections, fullscreen:fullscreen, socials:socials,
    payments:payments, analytics:analytics,
    on:bRoot.on, once:bRoot.once, off:bRoot.off, emit:bRoot.emit,
    changeLanguage:function(l){ api.language=(l||LANG); bRoot.emit("change:language",api.language);

    changeAvatarGenerator:function(g){ api.avatarGenerator=g; bRoot.emit("change:avatarGenerator",g);
                                       return Promise.resolve(g); },
    loadOverlay:function(){ return Promise.resolve(true); },
    pause:function(){ paused=true; bRoot.emit("pause"); },
    resume:function(){ paused=false; bRoot.emit("resume"); },
    ready:Promise.resolve(true)
  };

  function deep(){
    var f=function(){ return Promise.resolve(true); };
    return new Proxy(f,{
      get:function(t,p){
        if(p==="then"||p==="catch"||p==="finally") return undefined;
        if(p===Symbol.toPrimitive) return function(){ return 0; };
        if(p==="toString") return function(){ return ""; };
        return deep();
      },
      apply:function(){ return Promise.resolve(true); }
    });
  }
  return new Proxy(api,{
    get:function(t,p){
      if(p in t) return t[p];
      if(typeof p==="symbol") return undefined;
      return deep();
    }
  });
}

var _unityAwaiter = {};
_unityAwaiter.ready = new Promise(function(resolve,reject){
  _unityAwaiter.done = resolve;
  _unityAwaiter.abort = reject;
});
window.onGSInit = async function(gs){
  window.gs = gs;
  await _unityAwaiter.ready;
  var inst = new GameScoreUnity(gs, unityI);
  var t = inst.trigger.bind(inst);
  inst.trigger = function(n,p){ try{ return t(n,p); }catch(e){} };
  window.GameScore = new Proxy(inst, {
    get:function(o,p){
      var v = o[p];
      if(typeof v === "function"){
        return function(){
          var r;
          try{ r = v.apply(o, arguments); }catch(e){ return ""; }
          return (r === undefined || r === null) ? "" : r;
        };
      }
      return (v === undefined || v === null) ? "" : v;
    }
  });
  setTimeout(function(){
    try{ gs.player.fetchFields(); }catch(e){}
    try{ window.GameScore.AchievementsFetch(); }catch(e){}
    try{ window.GameScore.PaymentsFetchProducts(); }catch(e){}
  }, 800);
};
setTimeout(function(){ window.onGSInit(createLocalSDK()); },0);
</script>

<script>
const buildUrl = U("Build");
const loaderUrl = buildUrl + "/BattleTanks.loader.js";
const config = {
  dataUrl: buildUrl + "/BattleTanks.data.unityweb",
  frameworkUrl: buildUrl + "/BattleTanks.framework.js.unityweb",
  codeUrl: buildUrl + "/BattleTanks.wasm.unityweb",
  streamingAssetsUrl: U("StreamingAssets"),
  companyName: "ToxicFamilyGames",
  productName: "Battle Tanks",
  productVersion: "1.0",
};
const container = document.querySelector("#unity-container");
const canvas = document.querySelector("#unity-canvas");
const loadingCover = document.querySelector("#loading-cover");
const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
const progressBarFull = document.querySelector("#unity-progress-bar-full");
const spinner = document.querySelector('.spinner');
var unityI = null;

if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) container.className = "unity-mobile";
loadingCover.style.display = "";
document.addEventListener("pointerdown", () => { container.focus(); window.focus(); canvas.focus(); });
document.addEventListener("contextmenu", e => e.preventDefault());

async function mergeParts(name, count, mime){
  const chunks = [];
  let total = 0;
  for(let i=0;i<count;i++){
    const r = await fetch(buildUrl + "/" + name + ".part" + i);
    if(!r.ok) throw new Error(name + ".part" + i + " " + r.status);
    const u = new Uint8Array(await r.arrayBuffer());
    chunks.push(u); total += u.length;
    if(progressBarEmpty){ spinner.style.display="none"; progressBarEmpty.style.display="";
      progressBarFull.style.width = (((i+1)/count)*30) + "%"; }
  }
  const merged = new Uint8Array(total);
  let off = 0;
  chunks.forEach(c => { merged.set(c, off); off += c.length; });
  return URL.createObjectURL(new Blob([merged], {type:mime}));
}

let loaderReady=false, filesReady=false, started=false;
function boot(){
  if(started || !loaderReady || !filesReady) return;
  started = true;
  createUnityInstance(canvas, config, (progress) => {
    spinner.style.display = "none";
    progressBarEmpty.style.display = "";
    progressBarFull.style.width = `${30 + 70 * progress}%`;
  }).then((unityInstance) => {
    _unityAwaiter.done(unityInstance);
    unityI = unityInstance;
    loadingCover.style.display = "none";
  }).catch((message) => {
    _unityAwaiter.abort(message);
    console.error(message);
  });
}

(async function(){
  try{
    config.dataUrl = await mergeParts("BattleTanks.data.unityweb", DATA_PARTS, "application/octet-stream");
    filesReady = true;
    boot();
  }catch(e){ console.error(e); }
})();

const script = document.createElement("script");
script.src = loaderUrl;
script.onload = () => { loaderReady = true; boot(); };
document.body.appendChild(script);
</script>

    display: none;
    z-index: 99999;
    border-radius: 0; /* Sharp corners */
    overflow: hidden;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.45);
    box-sizing: border-box;
    transition: transform 0.5s ease-in-out; /* Smooth slide-in/out animation */
  }

  /* Slide-out animation */
  #ad-container.hidden {
    transform: translate(-50%, 100%); /* Slide down out of view */
  }

  #ad-iframe {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 745px; /* Updated width */
    height: 90px; /* Updated height */
    border: 0;
    display: block;
    overflow: hidden;
    pointer-events: auto;
    box-sizing: content-box;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  #ad-iframe::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  /* Close button with arrow */
  #close-ad {
    position: absolute;
    top: 6px;

    border: none;
    padding: 5px 9px;
    font-size: 13px;
    border-radius: 4px;
    cursor: not-allowed;
    opacity: 0.72;
    z-index: 100000;
    display: flex;
    align-items: center;
  }
  #close-ad.enabled {

</style>

<div id="ad-container" aria-hidden="true" role="dialog" aria-label="Advertisement">
  <iframe
    id="ad-iframe"
    src="https://script.google.com/macros/s/AKfycbzNG4z_PlG6Ke_bX5wSPKK2uBRB3IY9ouVzqM1shucYhSTvsJWRmyMyZaaC2z5S3ADN/exec"
    width="768px"
    height="95px"
    scrolling="no"
    frameborder="0"
    sandbox="allow-scripts allow-popups allow-same-origin"
  ></iframe>
  <button id="close-ad" disabled>Close (12)</button>
  <div id="ad-right-mask"></div>
</div>

<script>
  (function () {
    const showDelay = 2000; // 2 seconds delay before first show
    const countdownStart = 12; // 12 seconds countdown
    const reappearDelay = 150000; // 25 seconds before reappearance
    const adContainer = document.getElementById('ad-container');
    const closeBtn = document.getElementById('close-ad');

    function showAd() {
      // Show ad with smooth slide-in
      adContainer.style.display = 'block';
      adContainer.classList.remove('hidden');
      adContainer.setAttribute('aria-hidden', 'false');

      // Start countdown
      let timeLeft = countdownStart;
      closeBtn.textContent = `Close (${timeLeft})`;
      closeBtn.disabled = true;
      closeBtn.classList.remove('enabled');

      const t = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.textContent = `Close (${timeLeft})`;
        } else {
          clearInterval(t);
          closeBtn.disabled = false;
          closeBtn.classList.add('enabled');
          closeBtn.textContent = 'Close ↓';
        }
      }, 1000);
    }

    // Initial ad show
    setTimeout(showAd, showDelay);

    // Close with animation and schedule reappearance
    closeBtn.addEventListener('click', () => {
      if (closeBtn.disabled) return;
      adContainer.classList.add('hidden');
      adContainer.setAttribute('aria-hidden', 'true');
      // Schedule reappearance without removing or reloading iframe
      setTimeout(showAd, reappearDelay);
    });
  })();
</script>
